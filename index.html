// ─── Calcul automatique du prix d'achat ──────────────────────────
function computePxAchat(books, expenses){
  const byAchat={};
  books.forEach(b=>{const k=String(b.numAchat||"0");if(!byAchat[k])byAchat[k]=[];byAchat[k].push(b)});
  const totalAchatByVente={};
  expenses.forEach(e=>{if(e.categorie==="Achat de livres"){const ek=String(e.venteNum);totalAchatByVente[ek]=(totalAchatByVente[ek]||0)+e.montant}});
  const result={};
  Object.entries(byAchat).forEach(([num, grp])=>{
    const totalVente=totalAchatByVente[num]||0;
    const sommeMEV=grp.reduce((a,b)=>a+(b.pxMiseEnVente||0),0);
    grp.forEach(b=>{
      if(sommeMEV>0&&totalVente>0){
        result[b.id]=Math.round(((b.pxMiseEnVente||0)/sommeMEV)*totalVente*100)/100;
      } else {
        result[b.id]=0;
      }
    });
  });
  return result;
}

// Normalise le texte : première lettre de chaque mot en majuscule, reste en minuscule
// sauf les mots-outils courants (articles, prépositions, conjonctions FR/EN) qui restent bas de casse
// sauf s'ils sont en début de chaîne
const LOWER_WORDS=new Set(["de","d","du","des","le","la","les","l","un","une","et","ou","à","a","au","aux","en","par","pour","sur","sous","dans","avec","sans","entre","vers","chez","dont","que","qui","qu","se","si","ni","car","mais","or","donc","comme","selon","après","avant","pendant","depuis","contre","lors","dès","via","of","the","a","an","and","or","but","in","on","at","to","for","by","with","from","into","onto","over","under","about","after","before","during","through","between","among","without"]);
function smartCase(str){
  if(!str)return str;
  return str.split(/\s+/).map((word,i)=>{
    if(!word)return word;
    // Preserve ALL-CAPS abbreviations of 1-3 chars (like "EO", "XVe")
    if(word.length<=3&&word===word.toUpperCase()&&/[A-Z]/.test(word))return word;
    const lower=word.toLowerCase();
    // First word always capitalised
    if(i===0)return lower.charAt(0).toUpperCase()+lower.slice(1);
    // Common lower words stay lowercase
    if(LOWER_WORDS.has(lower))return lower;
    return lower.charAt(0).toUpperCase()+lower.slice(1);
  }).join(" ");
}

    {(()=>{const livré=book.dateLivraison?"Oui":"Non";const ba=book.pxMiseEnVente?(book.pxMiseEnVente-(book.pxAchat||0)-(book.pxMiseEnVente*0.1)-10):0;const br=book.vendu==="Oui"?((book.pxEncaisse||0)-(book.commissionVente||0)-(book.fraisExpedition||0)-(book.pxAchat||0)):0;const diff=book.vendu==="Oui"?(br-ba):0;return(<Sec title="Expédition & Bénéfice"><I l="Livré" v={livré}/><I l="Frais d'expédition" v={fmt(book.fraisExpedition)}/><I l="Bénéfice attendu" v={book.pxMiseEnVente?fmt(ba):"—"}/><I l="Bénéfice réalisé" v={book.vendu==="Oui"?fmt(br):"—"}/><I l="Différence" v={book.vendu==="Oui"?fmt(diff):"—"}/></Sec>)})()}

  const venteInfo=useMemo(()=>{const m={};expenses.filter(e=>e.categorie==="Achat de livres"||e.categorie==="Divers").forEach(e=>{if(!m[e.venteNum])m[e.venteNum]={date:e.date,lieu:e.vendeur}});books.forEach(b=>{if(b.numAchat&&!m[b.numAchat]&&b.dateAchat)m[b.numAchat]={date:b.dateAchat,lieu:b.lieuAchat}});return m},[expenses,books]);
  const venteDates=useMemo(()=>{const d={};Object.entries(venteInfo).forEach(([k,v])=>{if(v.date){const[y,mo,da]=v.date.split("-");d[k]=da+"/"+mo+"/"+y+(v.lieu?" — "+v.lieu:"")}});return d},[venteInfo]);

  // Load saved handle on mount
  useEffect(()=>{

  const loadDirFiles=async(handle)=>{
    setDirLoading(true);setDirError("");setDirPreviews({});setDirSelected(new Set());

CATÉGORIE : Si les photos montrent un seul livre (un seul titre identifiable), remplis le champ "categorie" avec "Ouvrage".

Réponds UNIQUEMENT en JSON valide, sans texte avant/après, sans backticks markdown :
{

}

CHAMPS :

- format : UNE valeur parmi : "In 32","In 18","In 16","In 12","In 8","In 4","In Folio". MÉTHODE DE MESURE PRIORITAIRE — Si une règle graduée est visible en arrière-plan de la photo, mesure la hauteur du livre en centimètres en te servant de la règle comme référence. Applique ensuite ce tableau de correspondance (hauteur du livre en cm → format bibliographique) : plus de 35 cm → "In Folio" ; 25 à 35 cm → "In 4" ; 18 à 22 cm → "In 8" ; 12 à 18 cm → "In 12" ; moins de 12 cm → "In 16", "In 18" ou "In 32" selon l'appréciation. Si aucune règle n'est visible, déduis le format de la taille apparente du livre. Si impossible à déterminer, laisser vide.
- siecle : le siècle en nombre entier (ex: 17, 18, 19, 20). Déduis-le de la date d'édition si disponible (ex : date 1785 → siecle 18). Si la date est absente mais que des indices visuels permettent de situer le siècle avec certitude, indique-le. Sinon mettre 0.
- eo : "Oui" si c'est visiblement une édition originale (première édition de l'ouvrage), "Non" si ce n'est clairement pas le cas. Si tu as un doute, laisser vide.
- etat : UNE valeur parmi : "Excellent","Bon","Correct","Mauvais". Évalue l'état apparent du livre sur les photos. Si impossible, laisser vide.
- etatDesc : Description COURTE (5 à 20 mots max) de l'état du livre tel que tu le VOIS sur les photos. STRUCTURE OBLIGATOIRE : Commence TOUJOURS par l'une de ces formules suivie d'un point : "Très bon état.", "Bon état général.", "État correct.", "État moyen.", "Mauvais état.". Puis décris les défauts VISIBLES avec leur emplacement. EXTÉRIEUR : frottements, mors (1er/2ème), coiffes, dos, plat (1er/2ème), coins usés, épidermures. INTÉRIEUR — OBLIGATOIRE si des photos de l'intérieur sont présentes : si tu vois des rousseurs, précise leur intensité (légères/éparses/prononcées). Si l'intérieur paraît propre et sans défaut, écris "Intérieur frais." Si tu vois des mouillures ou taches, mentionne-les. Ne JAMAIS inventer de défauts non visibles. Si tu ne vois AUCUNE photo de l'intérieur, ne le mentionne pas. Exemples : "Bon état général. Frottements aux mors, intérieur frais.", "État correct. Coiffes usées, rousseurs éparses.", "Très bon état. Reliure solide, intérieur frais.", "État moyen. Mors fendus, rousseurs prononcées." Si tu ne vois pas assez bien, laisse VIDE.
- reliureDesc : Description PRÉCISE de la reliure telle que tu la VOIS sur les photos. COMMENCE TOUJOURS PAR "Reliure". N'utilise JAMAIS de points de suspension "..." dans ce champ. RÈGLE ABSOLUE : Ne décris QUE ce qui est VISIBLE. ATTENTION : ne confonds JAMAIS "dos à nerfs" (avec bandes horizontales en relief) et "dos lisse" (sans relief). Structure : "Reliure [type] [couleur si visible], [dos à nerfs OU dos lisse], [décor si visible]". Types possibles : plein cuir, demi-cuir, demi-basane, demi-chagrin, demi-veau, demi-maroquin, plein veau, plein maroquin, percaline, cartonnage, broché. Exemples : "Reliure demi-basane havane, dos à nerfs orné de fleurons dorés, titre doré", "Reliure plein veau marbré, dos lisse", "Reliure demi-chagrin noir, dos lisse, titre doré", "Reliure cartonnage d'éditeur". Si la reliure n'est pas visible ou si tu as un doute, laisse VIDE.
- caracSpecDesc : Complète la description de la reliure en mentionnant les caractéristiques spéciales VISIBLES sur les photos. Cette phrase viendra APRÈS la description de la reliure sur la même ligne. Inclure si visible : ex-libris (manuscrit, gravé, cachet), frontispice, gravures (nombre si visible), illustrations, cartes (dépliantes ou non), dédicace de l'auteur, exemplaire numéroté, cachets (bibliothèque, institution), envoi autographe. Exemples : "Ouvrage orné de 12 gravures hors-texte.", "Frontispice gravé représentant l'auteur.", "Ex-libris armorié au contreplat.", "Exemplaire numéroté (n°45/500).", "Envoi autographe de l'auteur au faux-titre.", "Cachet de bibliothèque au titre.", "Avec 2 cartes dépliantes.", "Dédicace manuscrite de l'auteur." Si aucune caractéristique spéciale n'est visible, laisse VIDE.
- contextualisation : Paragraphe de contextualisation du livre (3-5 phrases savantes et informatives). Présentation de l'ouvrage, de l'auteur, importance historique ou littéraire. Doit être précis et documenté, pas générique. Si tu ne connais pas l'ouvrage ou l'auteur, laisse VIDE plutôt que d'inventer.
- interetPour : UNE phrase indiquant à qui ce livre peut intéresser. Format : "Intéressera les amateurs de [thème], les collectionneurs de [type], les passionnés de [sujet]." Adapte selon le contenu du livre.
- caracSpec : mettre true UNIQUEMENT si visible sur les photos.
- pxMiseEnVente : si un post-it (jaune ou blanc) est visible sur le livre dans les photos, lis le chiffre qui y est inscrit et place-le ici comme nombre entier (ex: 150). Ce chiffre représente le prix de mise en vente souhaité. Si aucun post-it n'est visible, si le chiffre est illisible, ou si tu as le moindre doute, mettre 0.

        </div>

      {photos.length>0&&<div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center",marginBottom:10}}>

          <button onClick={()=>removePhoto(i)} style={{position:"absolute",top:2,right:2,background:"rgba(0,0,0,.75)",border:"none",color:"#c94c4c",fontSize:13,cursor:"pointer",borderRadius:"50%",width:18,height:18,display:"flex",alignItems:"center",justifyContent:"center",padding:0,lineHeight:1}}>✕</button>
        </div>))}
      </div>}
      {photos.length>0&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>

          if(!apiKey){setShowKeyInput(true);return;}

          if(isMobile&&autoCamera){
            setPendingAutoSave(true);
          }
        }} disabled={analyzing} style={{padding:"12px 28px",background:analyzing?"linear-gradient(135deg,#4a5a7a,#3a4a6a)":"linear-gradient(135deg,#4cc98c,#2a9960)",border:"none",borderRadius:10,color:"#fff",fontSize:14,fontWeight:700,cursor:analyzing?"wait":"pointer",fontFamily:"'JetBrains Mono',monospace",display:"flex",alignItems:"center",gap:10,boxShadow:"0 4px 16px rgba(76,201,140,.3)"}}>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>}
        {analyzing?"Analyse...":"Envoyer"}
        </button>
        {!isMobile&&analyzeMsg&&analyzeMsg.startsWith("✓")&&<button onClick={handleSaveFromPhoto} style={{...btnP,padding:"10px 20px",background:"linear-gradient(135deg,#4cc98c,#2a9960)",fontSize:12,display:"flex",alignItems:"center",gap:7}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>{book?"Modifier":"Ajouter"}</button>}

      <button onClick={async()=>{
        if(!photos.length){alert("Ajoutez des photos pour obtenir une estimation Claude.");return;}
        if(!apiKey){setShowKeyInput(true);return;}
        setEstimLoading(true);setShowEstimModal(true);setEstimClaude("");setEstimInteret(null);
        try{
          const imageContent=photos.map(p=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:p.data}}));
          const response=await fetch("https://api.anthropic.com/v1/messages",{
            method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
            body:JSON.stringify({
              model:"claude-sonnet-4-20250514",max_tokens:2000,
              messages:[{role:"user",content:[
                ...imageContent,
                {type:"text",text:`Tu es un expert bibliophile spécialisé dans les livres anciens. Voici les photos d'un livre que j'envisage de vendre dans le cadre de mon activité "Livres & Reliures" (négoce de livres anciens, XVIe au XIXe siècle, sur eBay, AbeBooks et Livre-Rare-Book).

Peux-tu me faire — en 20 lignes maximum — une estimation de ce livre en tenant compte de l'année d'édition. Si tu n'as pas de prix pour l'année d'édition du livre, tu peux donner pour information le prix de vente des autres éditions. Indique si tu penses que c'est une édition originale ou pas. Indique-moi si ce livre aura de l'intérêt pour la vente dans le cadre de mon activité Livres & Reliures.

N'invente aucune information. Si tu penses que je n'ai pas tous les volumes ou si tu penses qu'il faut vérifier la présence d'une carte/gravure ou autre élément qui impacte la valeur du livre, demande-moi si je les ai bien.

IMPORTANT : 
1. En TOUTE PREMIÈRE LIGNE de ta réponse, écris UNIQUEMENT : [INTERET:OUI] ou [INTERET:NON] selon si le livre est intéressant pour Livres & Reliures.
2. En DEUXIÈME LIGNE, écris UNIQUEMENT la fourchette de prix suggérée au format : [PRIX:XX-YY] (ex: [PRIX:80-120])
3. Ensuite, en GRAS (avec ** **) et en 4-5 lignes maximum, donne une synthèse pour expliquer si le livre est intéressant et le prix suggéré.
4. Puis développe ton analyse en 20 lignes max.`}
              ]}]
            })
          });
          const data=await response.json();
          if(data.error){setEstimClaude("Erreur: "+data.error.message);setEstimLoading(false);return;}
          const text=data.content?.[0]?.text||"Pas de réponse";
          
          // Extraire l'intérêt
          const interetMatch=text.match(/\[INTERET:(OUI|NON)\]/i);
          if(interetMatch){
            setEstimInteret(interetMatch[1].toUpperCase()==="OUI");
          }
          
          // Extraire le prix
          const prixMatch=text.match(/\[PRIX:(\d+[-–]\d+)\]/i);
          if(prixMatch){
            s("prixConseilleIA",prixMatch[1].replace("–","-"));
          }
          
          // Nettoyer le texte des balises techniques
          let cleanText=text.replace(/\[INTERET:(OUI|NON)\]\s*/gi,"").replace(/\[PRIX:\d+[-–]\d+\]\s*/gi,"");
          
          // Convertir le markdown en HTML basique
          let html=cleanText
            .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
            .replace(/\n\n/g,'</p><p>')
            .replace(/\n/g,'<br/>');
          html='<p>'+html+'</p>';
          setEstimClaude(html);
        }catch(err){
          setEstimClaude("Erreur: "+err.message);
        }
        setEstimLoading(false);
      }} disabled={estimLoading} style={{...btnS,padding:"5px 10px",fontSize:10,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:4,background:estimLoading?"#2a3a5a":"linear-gradient(135deg,#c9a84c22,#c9a84c11)",borderColor:"#c9a84c",color:"#c9a84c",opacity:estimLoading?0.6:1}}>

// ─── Ventes ─────────────────────────────────────────────────────────
const Ventes=({books,expenses})=>{
  const vendus=useMemo(()=>books.filter(b=>b.vendu==="Oui").sort((a,b)=>(b.dateVente||"").localeCompare(a.dateVente||"")),[books]);
  const enVente=useMemo(()=>books.filter(b=>b.publie==="Oui"&&b.vendu!=="Oui").sort((a,b)=>b.pxMiseEnVente-a.pxMiseEnVente),[books]);
  const totalDep=useMemo(()=>{
    const now=new Date();const allExp=[...expenses];
    const hasMonth=(y,m)=>allExp.some(e=>e.categorie==="Abonnement Ebay"&&e.date&&e.date.startsWith(y+"-"+(m<10?"0":"")+m));
    const start=new Date("2025-10-01");let d=new Date(start);
    while(d<=now||(d.getMonth()<=now.getMonth()&&d.getFullYear()<=now.getFullYear())){const y=d.getFullYear(),m=d.getMonth()+1;if(!hasMonth(y,m)){allExp.push({montant:20})}d.setMonth(d.getMonth()+1)}
    return allExp.reduce((a,b)=>a+(b.montant||0),0);
  },[expenses]);
  const totalEnc=vendus.reduce((a,b)=>a+(b.pxEncaisse||0)-(b.commissionVente||0),0);
  const benefRealise=(b)=>(b.pxEncaisse||0)-(b.commissionVente||0)-(b.fraisExpedition||0)-(b.pxAchat||0);
  return(<div>
    <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:28}}>
      <Stat label="Vendus" value={vendus.length} accent="#4cc9a8"/><Stat label="CA encaissé" value={fmt(totalEnc)} accent="#4cc98c"/>
      <Stat label="Résultat net" value={fmt(totalEnc-totalDep)} accent={(totalEnc-totalDep)>=0?"#4cc98c":"#c94c4c"}/><Stat label="En vente" value={enVente.length} sub={"Bénéf att: "+fmt(enVente.reduce((a,b)=>a+(b.pxMiseEnVente?(b.pxMiseEnVente-(b.pxAchat||0)-(b.pxMiseEnVente*0.1)-10):0),0))} accent="#c9a84c"/>
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:20}}>
      <div style={{...c,flex:"1 1 450px"}}><h3 style={{margin:"0 0 16px",fontSize:13,textTransform:"uppercase",letterSpacing:2,color:"#6a7a9a",fontFamily:"'JetBrains Mono',monospace"}}>Ventes réalisées</h3>
        {vendus.length===0?<div style={{color:"#3a4a6a",textAlign:"center",padding:30,fontStyle:"italic"}}>Aucune vente</div>:vendus.map(b=>{const br=benefRealise(b);return(<div key={b.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid #111827",flexWrap:"wrap",gap:6}}>
          <div><div style={{color:"#e6f1ff",fontWeight:600,fontSize:13,fontFamily:"'Playfair Display',serif"}}>{b.titre}</div><div style={{color:"#4a5a7a",fontSize:11,marginTop:2}}>{b.auteur} · {fmtD(b.dateVente)}</div></div>
          <div style={{textAlign:"right"}}><div style={{color:"#4cc9a8",fontWeight:700,fontFamily:"'JetBrains Mono',monospace",fontSize:14}}>{fmt(b.pxEncaisse)}</div><div style={{color:br>=0?"#4cc98c":"#c94c4c",fontSize:11,fontFamily:"'JetBrains Mono',monospace"}}>Bénéf: {fmt(br)}</div></div>
        </div>)})}</div>
      <div style={{...c,flex:"1 1 400px"}}><h3 style={{margin:"0 0 16px",fontSize:13,textTransform:"uppercase",letterSpacing:2,color:"#6a7a9a",fontFamily:"'JetBrains Mono',monospace"}}>En vente ({enVente.length})</h3>
        {enVente.slice(0,20).map(b=>(<div key={b.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid #111827",gap:6}}>
          <div><div style={{color:"#ccd6f6",fontSize:13,fontFamily:"'Playfair Display',serif"}}>{b.titre}</div><div style={{color:"#3a4a6a",fontSize:10,marginTop:2}}>{b.dureeVente}</div></div>
          <div style={{color:"#c9a84c",fontWeight:700,fontFamily:"'JetBrains Mono',monospace",fontSize:13,whiteSpace:"nowrap"}}>{fmt(b.pxMiseEnVente)}</div>
        </div>))}</div>
    </div>
  </div>);
};


// ——— BidMax Calculator ———
function BidMaxCalc({open,onClose}) {
  const [estLots,setEstLots]=useState("");
  const [estOuvrages,setEstOuvrages]=useState("");
  const [commCP,setCommCP]=useState(14.28);
  const [fraisLiv,setFraisLiv]=useState("");

  const el=parseFloat(estLots)||0;
  const eo=parseFloat(estOuvrages)||0;
  const cp=(parseFloat(commCP)||0)/100;
  const fl=parseFloat(fraisLiv)||0;
  const bidmax=cp<1?(el+0.1*eo-fl)/(1+cp):0;
  const commMontant=bidmax*cp;

  if(!open)return null;
  const lbl={display:"block",fontSize:10,textTransform:"uppercase",letterSpacing:1.5,color:"#5a7a9a",marginBottom:5,fontFamily:"'JetBrains Mono',monospace"};
  const fld={width:"100%",padding:"9px 12px",background:"#0d1525",border:"1px solid #1e2d4a",borderRadius:8,color:"#e6f1ff",fontSize:13,fontFamily:"'JetBrains Mono',monospace",outline:"none",boxSizing:"border-box"};
  return(<Modal open={open} onClose={onClose} title="↗ Calcul de BidMax" narrow>
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div><label style={lbl}>Estimation des lots (€)</label><input type="number" step="0.01" value={estLots} onChange={e=>setEstLots(e.target.value)} placeholder="0" style={fld}/></div>
      <div><label style={lbl}>Estimation des ouvrages (€)</label><input type="number" step="0.01" value={estOuvrages} onChange={e=>setEstOuvrages(e.target.value)} placeholder="0" style={fld}/></div>
      <div><label style={lbl}>Commission CP (%)</label><input type="number" step="0.01" value={commCP} onChange={e=>setCommCP(e.target.value)} placeholder="14.28" style={fld}/></div>
      <div><label style={lbl}>Frais de livraison (€)</label><input type="number" step="0.01" value={fraisLiv} onChange={e=>setFraisLiv(e.target.value)} placeholder="0" style={fld}/></div>
      <div style={{background:"linear-gradient(135deg,#1a1a2e,#16213e)",border:"1px solid #c9a84c44",borderRadius:12,padding:20,marginTop:8}}>
        <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:2,color:"#6a7a9a",marginBottom:12,fontFamily:"'JetBrains Mono',monospace"}}>Résultat</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <span style={{color:"#e6f1ff",fontSize:14,fontWeight:600}}>BidMax</span>
          <span style={{color:"#c9a84c",fontSize:28,fontWeight:700,fontFamily:"'Playfair Display',serif"}}>{bidmax>0?fmt(bidmax):"—"}</span>
        </div>
        <div style={{fontSize:11,color:"#6a7a9a",fontFamily:"'JetBrains Mono',monospace",lineHeight:1.8}}>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>Estimation lots</span><span style={{color:"#8892b0"}}>{fmt(el)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>10% estimation ouvrages</span><span style={{color:"#8892b0"}}>{fmt(eo*0.1)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>Commission CP ({commCP}%)</span><span style={{color:"#c94c4c"}}>-{fmt(commMontant)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between"}}><span>Frais de livraison</span><span style={{color:"#c94c4c"}}>-{fmt(fl)}</span></div>
          <div style={{borderTop:"1px solid #1e2d4a",marginTop:8,paddingTop:8,display:"flex",justifyContent:"space-between",fontWeight:700}}><span style={{color:"#e6f1ff"}}>= BidMax</span><span style={{color:"#c9a84c"}}>{fmt(bidmax)}</span></div>
        </div>
      </div>
      <div style={{fontSize:10,color:"#3a4a6a",fontFamily:"'JetBrains Mono',monospace",fontStyle:"italic",marginTop:4}}>
        Formule : (EstLots + 10% EstOuvrages - FraisLiv) ÷ (1 + CommCP%)
      </div>
    </div>
  </Modal>);
}

const Sourcing=({books,expenses})=>{
  const venteNames=VENTE_NAMES_INIT;
  const allVenteNums=useMemo(()=>{
    const fromBooks=books.map(b=>b.numAchat).filter(Boolean);
    const fromExpenses=expenses.filter(e=>e.categorie==="Achat de livres"&&e.venteNum).map(e=>e.venteNum);
    return[...new Set([...fromBooks,...fromExpenses])].filter(n=>n!=="G"&&n!=="TOUTES"&&n!=="CUSTOM");
  },[books,expenses]);
  const ventes=useMemo(()=>{
    const m={};
    allVenteNums.forEach(k=>{m[k]={count:0,spent:0,invested:0,fraisLiv:0,sold:0,revenue:0,ba:0,br:0,lieu:""}});
    books.forEach(b=>{
      const k=b.numAchat||"?";
      if(!m[k])m[k]={count:0,spent:0,invested:0,fraisLiv:0,sold:0,revenue:0,ba:0,br:0,lieu:""};
      m[k].count++;m[k].spent+=b.pxAchat;
      m[k].ba+=b.pxMiseEnVente?(b.pxMiseEnVente-(b.pxAchat||0)-(b.pxMiseEnVente*0.1)-10):0;
      if(b.vendu==="Oui"){m[k].br+=(b.pxEncaisse||0)-(b.commissionVente||0)-(b.fraisExpedition||0)-(b.pxAchat||0)}
      if(!m[k].lieu&&b.lieuAchat)m[k].lieu=b.lieuAchat;
      if(b.vendu==="Oui"){m[k].sold++;m[k].revenue+=(b.pxEncaisse||0)-(b.commissionVente||0)}
    });
    expenses.forEach(e=>{
      if(e.categorie==="Achat de livres"&&e.venteNum&&m[e.venteNum])m[e.venteNum].invested+=(e.montant||0);
      if(e.categorie==="Frais de livraison"&&e.venteNum&&m[e.venteNum])m[e.venteNum].fraisLiv+=(e.montant||0);
    });
    return Object.entries(m).map(([n,d])=>({num:n,name:venteNames[n]||("Vente "+n+(d.lieu?" — "+d.lieu:"")),...d})).sort((a,b)=>Number(b.num)-Number(a.num));
  },[books,expenses,allVenteNums]);
  const totalInvestiGlobal=useMemo(()=>ventes.reduce((a,v)=>a+(v.invested||v.spent||0),0),[ventes]);
  const totalBenefRealise=useMemo(()=>ventes.reduce((a,v)=>a+v.br,0),[ventes]);
  const nbVentesHorsZero=ventes.filter(v=>v.num!=="0").length;
  const recent=useMemo(()=>[...books].sort((a,b)=>(b.dateAchat||"").localeCompare(a.dateAchat||"")).slice(0,15),[books]);
  const livresAvecPrix=books.filter(b=>b.pxMiseEnVente>0);
  const [bidMax,setBidMax]=useState(false);
  return(<div>
    <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:28}}>
      <Stat label="Achats" value={nbVentesHorsZero} accent="#c9a84c"/><Stat label="Total investi" value={fmt(totalInvestiGlobal)} accent="#a84cc9"/>
      <div onClick={()=>setBidMax(true)} style={{flex:"0 0 auto",padding:"14px 24px",background:"linear-gradient(135deg,#c9a84c,#a07c30)",borderRadius:8,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,transition:"all .2s"}}>
        <div style={{fontSize:14,fontWeight:800,letterSpacing:1,color:"#0a0f1e",fontFamily:"'JetBrains Mono',monospace",whiteSpace:"nowrap"}}>↗ Calcul BidMax</div>
      </div>
      <Stat label="Px achat moyen" value={books.length?fmt(books.reduce((a,b)=>a+b.pxAchat,0)/books.length):"—"} accent="#4c8cc9"/><Stat label="Prix de vente moyen" value={livresAvecPrix.length?fmt(livresAvecPrix.reduce((a,b)=>a+b.pxMiseEnVente,0)/livresAvecPrix.length):"—"} accent="#c9a84c"/><Stat label="Gains nets" value={fmt(totalBenefRealise)} accent="#4cc98c"/>
    </div>
    <BidMaxCalc open={bidMax} onClose={()=>setBidMax(false)}/>
    <div style={{display:"flex",flexWrap:"wrap",gap:20}}>
      <div style={{...c,flex:"1 1 450px"}}><h3 style={{margin:"0 0 16px",fontSize:13,textTransform:"uppercase",letterSpacing:2,color:"#6a7a9a",fontFamily:"'JetBrains Mono',monospace"}}>Performance par vente</h3>
        {ventes.map(s=>{const totalInv=(s.invested||0)+(s.fraisLiv||0)||(s.spent||0);const amortPct=totalInv>0?Math.min(100,Math.round((s.br/totalInv)*100)):0;return(<div key={s.num} style={{padding:"18px 14px",marginBottom:16,border:"1px solid rgba(255,255,255,.25)",background:"linear-gradient(180deg,rgba(30,45,74,.25),rgba(15,22,41,.4))",borderRadius:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{color:"#e6f1ff",fontWeight:600,fontSize:14}}>{s.name}</span><span style={{color:"#4a5a7a",fontSize:12,fontFamily:"'JetBrains Mono',monospace"}}>{s.count} livre{s.count>1?"s":""}</span></div>
          <div style={{display:"flex",gap:14,fontSize:11,fontFamily:"'JetBrains Mono',monospace",flexWrap:"wrap"}}><span style={{color:"#a84cc9"}}>Investi: {fmt(s.invested||s.spent)}</span><span style={{color:"#4cc9a8"}}>Vendu: {s.sold}/{s.count}</span><span style={{color:"#4c8cc9"}}>CA: {fmt(s.revenue)}</span><span style={{color:"#c9a84c"}}>Bénéf att: {fmt(s.ba)}{(s.invested||s.spent)>0&&<span style={{color:"#8892b0"}}> (x {(s.ba/(s.invested||s.spent)).toFixed(1)})</span>}</span></div>
          {s.ba>0&&(()=>{const pct=Math.min(100,Math.round((s.br/s.ba)*100));return(<div style={{marginTop:8}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,fontFamily:"'JetBrains Mono',monospace",marginBottom:3}}><span style={{color:"#8892b0"}}>Bénéf réalisé: {fmt(s.br)} / {fmt(s.ba)}</span><span style={{color:pct>=100?"#4cc98c":pct>=50?"#c9a84c":"#8892b0",fontWeight:600}}>{pct}%</span></div>
            <div style={{height:6,background:"#0d1525",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:pct>=100?"linear-gradient(90deg,#4cc98c,#2ecc71)":pct>=50?"linear-gradient(90deg,#c9a84c,#e6c44c)":"linear-gradient(90deg,#4c8cc9,#6aa8e6)",borderRadius:3,transition:"width .5s ease"}}/></div>
          </div>)})()}
          {totalInv>0&&<div style={{marginTop:6}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,fontFamily:"'JetBrains Mono',monospace",marginBottom:3}}><span style={{color:"#6a7a9a"}}>Amortissement: {fmt(s.br)} / {fmt(totalInv)}</span><span style={{color:amortPct>=100?"#4cc98c":amortPct>=50?"#a84cc9":"#6a7a9a",fontWeight:600}}>{amortPct}%</span></div>
            <div style={{height:5,background:"#0d1525",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:amortPct+"%",background:amortPct>=100?"linear-gradient(90deg,#4cc98c,#2ecc71)":amortPct>=50?"linear-gradient(90deg,#a84cc9,#c86ce6)":"linear-gradient(90deg,#5a6a8a,#7a8aaa)",borderRadius:3,transition:"width .5s ease"}}/></div>
          </div>}
        </div>)})}</div>
      <div style={{...c,flex:"1 1 350px"}}><h3 style={{margin:"0 0 16px",fontSize:13,textTransform:"uppercase",letterSpacing:2,color:"#6a7a9a",fontFamily:"'JetBrains Mono',monospace"}}>Derniers achats</h3>
        {recent.map(b=>(<div key={b.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:"1px solid #111827"}}>
          <div><div style={{color:"#e6f1ff",fontSize:12,fontWeight:600,fontFamily:"'Playfair Display',serif"}}>{b.titre.length>45?b.titre.slice(0,45)+"…":b.titre}</div><div style={{color:"#3a4a6a",fontSize:10,marginTop:2}}>{fmtD(b.dateAchat)} · {b.lieuAchat}</div></div>
          <div style={{color:"#a84cc9",fontWeight:700,fontFamily:"'JetBrains Mono',monospace",fontSize:12,whiteSpace:"nowrap"}}>{fmt(b.pxAchat)}</div>
        </div>))}</div>
    </div>
  </div>);
};

// ─── Achats / Frais ──────────────────────────────────────────────────
const VENTE_NAMES_INIT={"0":"Achat 0 — Achat Gratuit (01/01/2025)","1":"Achat 1 — Inter Ville CP (24/09/2025)","2":"Achat 2 — Passerelle des Enchères (11/10/2025)","3":"Achat 3 — Deloys (22/10/2025)","4":"Achat 4 — Khan & Associés (04/03/2026)","5":"Achat 5 — Millon (10/03/2026)","6":"Achat 6 — Dufreche (19/03/2026)"};
const Depenses=({expenses,onAdd,onDelete,books})=>{
  const [vue,setVue]=useState("par_achat");
  const [moAchat,setMoAchat]=useState(false);
  const [moDep,setMoDep]=useState(false);
  const [editExp,setEditExp]=useState(null);
  const [open,setOpen]=useState({});
  const [venteNames,setVenteNames]=useState(VENTE_NAMES_INIT);
  useEffect(()=>{
    const m={...VENTE_NAMES_INIT};
    // Build names from books: group by numAchat, pick first lieuAchat + dateAchat
    const byNum={};
    books.forEach(b=>{if(b.numAchat&&!byNum[b.numAchat]&&b.lieuAchat&&b.dateAchat)byNum[b.numAchat]={lieu:b.lieuAchat,date:b.dateAchat}});
    Object.entries(byNum).forEach(([k,{lieu,date}])=>{
      if(!m[k]){const[y,mo,da]=date.split("-");m[k]="Achat "+k+" — "+lieu+" ("+da+"/"+mo+"/"+y+")"}
    });
    // Also pick up any achat nums from expenses not yet in m
    expenses.filter(e=>e.categorie==="Achat de livres"&&e.venteNum&&!m[e.venteNum]).forEach(e=>{
      const[y,mo,da]=(e.date||"").split("-");m[e.venteNum]="Achat "+e.venteNum+(e.vendeur?" — "+e.vendeur:"")+(da?(" ("+da+"/"+mo+"/"+y+")"):"");
    });
    setVenteNames(m);
  },[books,expenses]);
  const [fa,setFa]=useState({vendeur:"",date:new Date().toISOString().slice(0,10),montant:"",notes:""});
  const defaultFrais={categorie:"Frais de livraison",venteNum:"TOUTES",date:new Date().toISOString().slice(0,10),vendeur:"",montant:0,description:"",recurrence:"ponctuel",frequence:"mensuel",affectation:"toutes",dateDe:"",dateA:""};
  const [f,setF]=useState({...defaultFrais});
  const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const nextAchatNum=useMemo(()=>{
    const fromNames=Object.keys(venteNames).filter(k=>!isNaN(k)).map(Number);
    const fromExp=expenses.filter(e=>e.venteNum&&!isNaN(e.venteNum)&&e.categorie==="Achat de livres").map(e=>Number(e.venteNum));
    const all=[...fromNames,...fromExp].filter(n=>n>=0);
    return all.length?Math.max(...all)+1:1;
  },[venteNames,expenses]);

  const allExpenses=useMemo(()=>{
    const now=new Date();const existing=expenses.map((e,i)=>({...e,_origIdx:i}));
    const hasMonth=(y,m)=>existing.some(e=>e.categorie==="Abonnement Ebay"&&e.date&&e.date.startsWith(y+"-"+(m<10?"0":"")+m));
    const mNames=["","Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
    const start=new Date("2025-10-01");let d=new Date(start);
    while(d<=now||(d.getMonth()<=now.getMonth()&&d.getFullYear()<=now.getFullYear())){
      const y=d.getFullYear(),m=d.getMonth()+1;
      if(!hasMonth(y,m)){existing.push({venteNum:"TOUTES",date:y+"-"+(m<10?"0":"")+m+"-01",categorie:"Abonnement Ebay",vendeur:"eBay",montant:20,description:"Abonnement eBay - "+mNames[m]+" "+y,_auto:true})}
      d.setMonth(d.getMonth()+1);
    }
    return existing;
  },[expenses]);

  const total=allExpenses.reduce((a,b)=>a+b.montant,0);
  const grouped=useMemo(()=>{
    const m={};allExpenses.forEach(e=>{const k=(e.venteNum==="G"||e.venteNum==="TOUTES")?"TOUTES":e.venteNum||"TOUTES";if(!m[k])m[k]=[];m[k].push(e)});
    const allKeys=new Set([...Object.keys(venteNames),...Object.keys(m)]);
    const nameFor=(k)=>k==="TOUTES"?"Frais Généraux":k==="CUSTOM"?"Personnalisé":venteNames[k]||"Achat "+k;
    return [...allKeys].map(k=>({key:k,name:nameFor(k),items:(m[k]||[]).sort((a,b)=>(b.date||"").localeCompare(a.date||"")),total:(m[k]||[]).reduce((a,b)=>a+b.montant,0)})).sort((a,b)=>{if(a.key==="TOUTES")return 1;if(b.key==="TOUTES")return -1;if(a.key==="CUSTOM")return 1;if(b.key==="CUSTOM")return -1;return Number(b.key)-Number(a.key)});
  },[allExpenses,venteNames]);
  const chrono=useMemo(()=>[...allExpenses].sort((a,b)=>(b.date||"").localeCompare(a.date||"")),[allExpenses]);
  const toggle=(k)=>setOpen(p=>({...p,[k]:!p[k]}));
  const [moEditAchat,setMoEditAchat]=useState(false);
  const [editAchatData,setEditAchatData]=useState(null);
  const openEditExp=(e)=>{
    if(e.categorie==="Achat de livres"){
      setEditAchatData(e);
      setFa({vendeur:e.vendeur||"",date:e.date||"",montant:e.montant||0,notes:e.description||""});
      setMoEditAchat(true);
    } else {
      setEditExp(e);setF({categorie:e.categorie||"Frais de livraison",venteNum:e.venteNum||"TOUTES",date:e.date||"",vendeur:e.vendeur||"",montant:e.montant||0,description:e.description||"",recurrence:"ponctuel",frequence:"mensuel",affectation:(e.venteNum==="TOUTES"||e.venteNum==="G")?"toutes":e.venteNum==="CUSTOM"?"personnalise":"vente",dateDe:"",dateA:""});setMoDep(true);
    }
  };

  const handleCreateAchat=()=>{
    const num=String(nextAchatNum);
    const label="Achat "+num+" — "+fa.vendeur+" ("+fmtD(fa.date)+")";
    setVenteNames(p=>({...p,[num]:label}));
    if(+fa.montant>0)onAdd({venteNum:num,date:fa.date,categorie:"Achat de livres",vendeur:fa.vendeur,montant:+fa.montant,description:"Achat "+fa.vendeur+" du "+fmtD(fa.date)+(fa.notes?" — "+fa.notes:"")});
    setMoAchat(false);setFa({vendeur:"",date:new Date().toISOString().slice(0,10),montant:"",notes:""});
  };

  const handleAddFrais=()=>{
    const aff=f.affectation==="toutes"?"TOUTES":f.affectation==="personnalise"?"CUSTOM":f.venteNum;
    const desc=f.description+(f.affectation==="personnalise"&&f.dateDe&&f.dateA?" ["+fmtD(f.dateDe)+" → "+fmtD(f.dateA)+"]":"")+(f.recurrence==="recurrent"?" (récurrent: "+f.frequence+")":"");
    onAdd({venteNum:aff,date:f.date,categorie:f.categorie,vendeur:f.vendeur,montant:f.montant,description:desc});
    setMoDep(false);setEditExp(null);setF({...defaultFrais});
  };

  const handleEditAchat=()=>{
    if(!editAchatData)return;
    const idx=editAchatData._origIdx;
    if(idx!==undefined&&onDelete){
      onDelete(idx);
      const num=editAchatData.venteNum||"0";
      const label="Achat "+num+" — "+fa.vendeur+" ("+fmtD(fa.date)+")";
      setVenteNames(p=>({...p,[num]:label}));
      onAdd({venteNum:num,date:fa.date,categorie:"Achat de livres",vendeur:fa.vendeur,montant:+fa.montant,description:fa.notes||("Achat "+fa.vendeur+" du "+fmtD(fa.date))});
    }
    setMoEditAchat(false);setEditAchatData(null);
  };

  const handleDeleteAchat=(e)=>{
    if(e._origIdx!==undefined&&onDelete){
      if(window.confirm("Supprimer cet achat ?"))onDelete(e._origIdx);
    }
  };

  const renderTable=(items)=><table style={{width:"100%",borderCollapse:"collapse"}}>
    <thead><tr>{["Date","Catégorie","Vendeur","Montant","Description",""].map(h=><th key={h} style={{padding:"10px 14px",textAlign:"left",fontSize:10,textTransform:"uppercase",letterSpacing:1.5,color:"#4a5a7a",fontFamily:"'JetBrains Mono',monospace",borderBottom:"1px solid #111827"}}>{h}</th>)}</tr></thead>
    <tbody>{items.map((e,i)=>(<tr key={i} style={{borderBottom:"1px solid #0d1525"}}>
      <td style={{padding:"10px 14px",color:"#8892b0",fontSize:12}}>{fmtD(e.date)}</td>
      <td style={{padding:"10px 14px",color:"#6a8aaa",fontSize:12}}>{e.categorie}</td>
      <td style={{padding:"10px 14px",color:"#8892b0",fontSize:12}}>{e.vendeur}</td>
      <td style={{padding:"10px 14px",color:"#c94c8c",fontWeight:700,fontSize:13,fontFamily:"'JetBrains Mono',monospace"}}>{fmt(e.montant)}</td>
      <td style={{padding:"10px 14px",color:"#5a6a8a",fontSize:12,maxWidth:300,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.description}</td>
      <td style={{padding:"10px 14px",whiteSpace:"nowrap"}}>{e.categorie!=="Frais d'envoi"&&e.categorie!=="Frais d'envoi (Colissimo)"&&<><button onClick={()=>openEditExp(e)} style={{background:"none",border:"1px solid #2a3a5a",borderRadius:6,color:"#8892b0",fontSize:10,padding:"4px 10px",cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",marginRight:4}}>✎</button>{!e._auto&&e._origIdx!==undefined&&onDelete&&<button onClick={()=>{if(window.confirm("Supprimer cette écriture ?"))onDelete(e._origIdx)}} style={{background:"none",border:"1px solid #4a2a2a",borderRadius:6,color:"#c94c4c",fontSize:10,padding:"4px 10px",cursor:"pointer",fontFamily:"'JetBrains Mono',monospace"}}>✕</button>}</>}{(e.categorie==="Frais d'envoi"||e.categorie==="Frais d'envoi (Colissimo)")&&<span style={{color:"#4a5a7a",fontSize:9,fontFamily:"'JetBrains Mono',monospace",fontStyle:"italic"}}>via fiche livre</span>}</td>
    </tr>))}</tbody>
  </table>;

  return(<div>
    <div style={{display:"flex",flexWrap:"wrap",gap:14,marginBottom:28}}>
      <Stat label="Total dépenses" value={fmt(total)} accent="#c94c8c"/>
      <Stat label="Écritures" value={allExpenses.length} accent="#4c8cc9"/>
      <Stat label="Nb de ventes aux enchères" value={Object.keys(venteNames).filter(k=>!isNaN(k)&&Number(k)>=1).length} accent="#c9a84c"/>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:16}}>
      <div style={{display:"flex",gap:6}}>
        {[["par_achat","Par achat"],["chronologique","Chronologique"]].map(([k,l])=><button key={k} onClick={()=>setVue(k)} style={{padding:"7px 14px",border:"1px solid "+(vue===k?"#c9a84c33":"#1a2540"),borderRadius:8,background:vue===k?"linear-gradient(135deg,#c9a84c22,#c9a84c11)":"#0a0f1e",color:vue===k?"#c9a84c":"#4a5a7a",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace"}}>{l}</button>)}
      </div>
      <div style={{display:"flex",gap:10}}>
        <button style={btnP} onClick={()=>{setFa({vendeur:"",date:new Date().toISOString().slice(0,10),montant:"",notes:""});setMoAchat(true)}}>+ Nouvel achat</button>
        <button style={{...btnP,background:"linear-gradient(135deg,#ffffff,#e0e0e0)",color:"#1a1a2e"}} onClick={()=>{setEditExp(null);setF({...defaultFrais});setMoDep(true)}}>Saisir des frais</button>
      </div>
    </div>

    {vue==="par_achat"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
      {grouped.map(g=>(<div key={g.key} style={{...c,padding:0,overflow:"hidden"}}>
        <div onClick={()=>toggle(g.key)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 22px",cursor:"pointer",background:open[g.key]?"linear-gradient(135deg,#1a1a2e,#16213e)":"transparent",transition:"background .2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{color:"#4a5a7a",fontSize:14,transition:"transform .2s",transform:open[g.key]?"rotate(90deg)":"rotate(0)",display:"inline-block"}}>▶</span>
            <div>
              <div style={{color:"#e6f1ff",fontWeight:600,fontSize:14,fontFamily:"'Playfair Display',serif"}}>{g.name}</div>
              <div style={{color:"#4a5a7a",fontSize:10,fontFamily:"'JetBrains Mono',monospace",marginTop:2}}>{g.items.length} écriture{g.items.length>1?"s":""}</div>
            </div>
          </div>
          <div style={{color:"#c94c8c",fontWeight:700,fontSize:15,fontFamily:"'JetBrains Mono',monospace"}}>{fmt(g.total)}</div>
        </div>
        {open[g.key]&&<div style={{borderTop:"1px solid #1e2d4a"}}>
          {renderTable(g.items)}
          <div style={{padding:"12px 14px",textAlign:"right"}}><span style={{color:"#6a7a9a",fontWeight:700,fontSize:11,fontFamily:"'JetBrains Mono',monospace",marginRight:14}}>SOUS-TOTAL</span><span style={{color:"#c94c8c",fontWeight:700,fontSize:13,fontFamily:"'JetBrains Mono',monospace"}}>{fmt(g.total)}</span></div>
        </div>}
      </div>))}
    </div>}

    {vue==="chronologique"&&<div style={{...c,padding:0,overflow:"hidden"}}>
      {renderTable(chrono)}
      <div style={{padding:"14px 14px",textAlign:"right",borderTop:"1px solid #1e2d4a"}}><span style={{color:"#6a7a9a",fontWeight:700,fontSize:11,fontFamily:"'JetBrains Mono',monospace",marginRight:14}}>TOTAL</span><span style={{color:"#c94c8c",fontWeight:700,fontSize:15,fontFamily:"'JetBrains Mono',monospace"}}>{fmt(total)}</span></div>
    </div>}

    {/* Modal: Nouvel achat — noClickOutside */}
    <Modal open={moAchat} onClose={()=>setMoAchat(false)} title={"Nouvel achat — N°"+nextAchatNum} noClickOutside>
      <div style={{display:"flex",flexWrap:"wrap",gap:"0 14px"}}>
        <Field label="Nom du vendeur"><input style={inp} placeholder="ex: Drouot, Deloys..." value={fa.vendeur} onChange={e=>setFa(p=>({...p,vendeur:e.target.value}))}/></Field>
        <Field label="Date d'achat"><input style={{...inp,cursor:"pointer"}} type="date" value={fa.date} onClick={e=>{try{e.target.showPicker()}catch(ex){}}} onChange={e=>setFa(p=>({...p,date:e.target.value}))}/></Field>
        <Field label="Montant total €"><input style={inp} type="number" step="0.01" value={fa.montant} onChange={e=>setFa(p=>({...p,montant:e.target.value}))}/></Field>

// ─── Business Plan ──────────────────────────────────────────────────
const BusinessPlan=({books,expenses})=>{
  const [mode,setMode]=useState("previsionnel");
  const lp=(k,def)=>{try{const v=localStorage.getItem("bp2-"+k);return v!==null?JSON.parse(v):def}catch(e){return def}};
  const [pxVente,setPxVente]=useState(()=>lp("pxV",150));
  const [pxAchat,setPxAchat]=useState(()=>lp("pxA",13));
  const [fraisExp,setFraisExp]=useState(()=>lp("frE",13));
  const [fraisFixes,setFraisFixes]=useState(()=>lp("frF",30));
  const [tauxRot,setTauxRot]=useState(()=>lp("rot",0.35));
  const [injMensuelle,setInjMensuelle]=useState(()=>lp("injM",690));
  const [capitalTotal,setCapitalTotal]=useState(()=>lp("cap",10000));
  const [capitalDeploye,setCapitalDeploye]=useState(()=>lp("dep",1450));
  const [objectif,setObjectif]=useState(()=>lp("obj",2000));
  const [capaMois,setCapaMois]=useState(()=>lp("capM",87));
  const [stockInitial,setStockInitial]=useState(()=>lp("stk0",81));
  const [maxAchatsMois,setMaxAchatsMois]=useState(()=>lp("maxAch",100));
  const [stockMax,setStockMax]=useState(()=>lp("stkMax",1000));
  const sp=(k,v,fn)=>{const n=typeof v==="string"?parseFloat(v):v;if(!isNaN(n)){fn(n);try{localStorage.setItem("bp2-"+k,JSON.stringify(n))}catch(e){}}};
  const margeNette=pxVente-pxAchat-fraisExp;
  const nbMoisInjection=10;

  // ── Real data from CRM ──
  const real=useMemo(()=>{
    const ouv=books.filter(b=>b.categorie==="Ouvrage"||b.categorie==="Lot");
    const vendus=ouv.filter(b=>b.vendu==="Oui");
    const months={};const now=new Date();
    for(let m=new Date(2026,1,1);m<=now;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
      const key=m.getFullYear()+"-"+(m.getMonth()+1<10?"0":"")+(m.getMonth()+1);
      const mS=new Date(m);const mE=new Date(m.getFullYear(),m.getMonth()+1,0);
      const vM=vendus.filter(b=>{if(!b.dateVente)return false;const dd=new Date(b.dateVente);return dd>=mS&&dd<=mE});
      const aM=ouv.filter(b=>{if(!b.dateAchat)return false;const dd=new Date(b.dateAchat);return dd>=mS&&dd<=mE});
      const mevM=ouv.filter(b=>{if(!b.dateMiseEnVente)return false;const dd=new Date(b.dateMiseEnVente);return dd>=mS&&dd<=mE});
      // Coût d'achat des livres VENDUS ce mois (pas de tous les achats)
      const coutVendus=vM.reduce((a,b)=>a+(b.pxAchat||0),0);
      const coutAchats=aM.reduce((a,b)=>a+(b.pxAchat||0),0);
      months[key]={ventes:vM.length,ca:vM.reduce((a,b)=>a+(b.pxEncaisse||0),0),coutVendus,coutAchats,fraisExp:vM.reduce((a,b)=>a+(b.fraisExpedition||0),0),comm:vM.reduce((a,b)=>a+(b.commissionVente||0),0),achats:aM.length,mev:mevM.length};
    }
    const v15=vendus.filter(b=>b.dateVente&&new Date(b.dateVente)>=new Date(2026,1,15));
    const pxVR=v15.length?v15.reduce((a,b)=>a+(b.pxEncaisse||0),0)/v15.length:0;
    const pxAR=v15.length?v15.reduce((a,b)=>a+(b.pxAchat||0),0)/v15.length:0;
    const frER=v15.length?v15.reduce((a,b)=>a+(b.fraisExpedition||0),0)/v15.length:0;
    const stockActuel=ouv.filter(b=>b.publie==="Oui"&&b.vendu!=="Oui").length;
    const nonPublies=ouv.filter(b=>b.publie!=="Oui"&&b.vendu!=="Oui").length;
    const totalOuv=ouv.length;
    const jours=Math.max(1,Math.round((now-new Date(2026,1,15))/86400000));
    const rotAnn=stockActuel>0?(v15.length/jours*365)/stockActuel:0;
    const curKey=now.getFullYear()+"-"+(now.getMonth()+1<10?"0":"")+(now.getMonth()+1);
    const curM=months[curKey]||{ventes:0,ca:0,achats:0,mev:0,coutVendus:0,coutAchats:0,fraisExp:0,comm:0};
    const totalDepense=ouv.reduce((a,b)=>a+(b.pxAchat||0),0);
    return{months,pxVenteReel:pxVR,pxAchatReel:pxAR,fraisExpReel:frER,stockActuel,nonPublies,totalOuv,rotationReelle:rotAnn,margeReelle:pxVR-pxAR-frER,totalVentes:v15.length,totalCA:v15.reduce((a,b)=>a+(b.pxEncaisse||0),0),jours,curM,totalDepense};
  },[books,expenses]);

  // ── Trajectory ──
  const trajectory=useMemo(()=>{
    const rows=[];let enVente=stockInitial;let nonPub=0;let capitalRestant=Math.max(0,capitalTotal-capitalDeploye);let cumul=0;
    const mL=["Jan","Fév","Mars","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
    const rPxV=real.pxVenteReel||pxVente;const rPxA=real.pxAchatReel||pxAchat;const rFrE=real.fraisExpReel||fraisExp;
    const rRot=real.rotationReelle>0?Math.min(real.rotationReelle,0.70):tauxRot;
    for(let i=0;i<24;i++){
      const dt=new Date(2026,2+i,1);const yr=dt.getFullYear();const mo=dt.getMonth()+1;
      const key=yr+"-"+(mo<10?"0":"")+mo;const label=mL[dt.getMonth()]+" "+(yr%100);
      const isPast=dt<=new Date();const realM=real.months[key];
      const hasReal=isPast&&realM&&(realM.ventes>0||realM.achats>0||realM.mev>0);
      const inj=i<nbMoisInjection?injMensuelle:0;const injEff=Math.min(inj,capitalRestant);
      // Ventes = rotation on enVente stock only
      const ventesP=Math.max(1,Math.round(enVente*tauxRot/12));
      const cashFromSales=ventesP*(pxVente-fraisExp);
      const cashDispo=injEff+cashFromSales;
      const livresFromBudget=pxAchat>0?Math.round(cashDispo/pxAchat):0;
      // Cap achats: maxAchatsMois AND stock total (enVente+nonPub) must stay <= stockMax
      const totalStock=enVente+nonPub;
      const roomForStock=Math.max(0,stockMax-totalStock+ventesP); // ventes libèrent de la place
      const totalAchP=Math.min(livresFromBudget,maxAchatsMois,roomForStock);
      // Sourcing réellement utilisé (pas le cash dispo)
      const sourcingUsed=totalAchP*pxAchat;
      // Catalogage: process nonPub backlog + new achats, capped by capaMois
      const toCatalog=nonPub+totalAchP;
      const catalogDone=Math.min(toCatalog,capaMois);
      const newNonPub=toCatalog-catalogDone;
      const newEnVente=enVente+catalogDone-ventesP;
      const caP=ventesP*pxVente;const resP=ventesP*margeNette-fraisFixes;
      let vA,caA,resA,achA,enVenteA,nonPubA;
      if(hasReal){
        vA=realM.ventes;caA=realM.ca;achA=realM.achats;
        resA=caA-realM.coutVendus-realM.fraisExp-realM.comm-fraisFixes;
        const toCatA=nonPub+achA;const catDoneA=Math.min(toCatA,capaMois);
        nonPubA=toCatA-catDoneA;enVenteA=enVente+catDoneA-vA;
      } else {
        const uRot=mode==="actualise"?rRot:tauxRot;const uPxV=mode==="actualise"?rPxV:pxVente;
        const uPxA=mode==="actualise"?rPxA:pxAchat;const uFrE=mode==="actualise"?rFrE:fraisExp;
        vA=Math.max(1,Math.round(enVente*uRot/12));caA=vA*uPxV;
        const uCash=vA*(uPxV-uFrE);const uDispo=injEff+uCash;
        const uLivres=uPxA>0?Math.round(uDispo/uPxA):0;
        const uRoom=Math.max(0,stockMax-(enVente+nonPub)+vA);
        achA=Math.min(uLivres,maxAchatsMois,uRoom);
        const uToCat=nonPub+achA;const uCatDone=Math.min(uToCat,capaMois);
        nonPubA=uToCat-uCatDone;enVenteA=enVente+uCatDone-vA;
        resA=vA*(uPxV-uPxA-uFrE)-fraisFixes;
      }
      const row={mois:i+1,label,key,isPast,hasReal,
        prev:{inj:injEff,sourcingUsed,totalAch:totalAchP,ventes:ventesP,nonPub:newNonPub,enVente:newEnVente,catalog:Math.min(toCatalog,capaMois),catalogNeeded:toCatalog,ca:caP,res:resP},
        actu:{ventes:vA,ca:caA,achats:hasReal?achA:totalAchP,nonPub:mode==="actualise"?nonPubA:newNonPub,enVente:mode==="actualise"?enVenteA:newEnVente,res:resA}};
      cumul+=mode==="actualise"?row.actu.res:row.prev.res;row.cumul=cumul;
      if(mode==="actualise"){enVente=enVenteA;nonPub=nonPubA}else{enVente=newEnVente;nonPub=newNonPub}
      capitalRestant=Math.max(0,capitalRestant-injEff);rows.push(row)}
    return rows;
  },[mode,pxVente,pxAchat,fraisExp,fraisFixes,tauxRot,injMensuelle,capitalTotal,capitalDeploye,objectif,capaMois,capaMois,stockInitial,maxAchatsMois,stockMax,real]);

  // ── Helpers ──
  const ParamRow=({label,value,onChange,suffix=""})=>{

  const Gauge=({label,current,target,accent="#c9a84c",fmtFn,tick})=>{

    const pct=tgt>0?Math.min(Math.round(cur/tgt*100),999):0;const w=Math.min(pct,100);

  const SectionTitle=({children})=>(<div style={{fontSize:9,color:"#c9a84c",fontFamily:"'JetBrains Mono',monospace",textTransform:"uppercase",letterSpacing:1.5,marginBottom:6,marginTop:12,borderTop:"1px solid #1e2d4a",paddingTop:10}}>{children}</div>);

  // Score gauge — red(left) to green(right), needle points right = good
  const ScoreGauge=({planRes,realRes})=>{
    const ratio=planRes>0?Math.max(0,realRes/planRes):0;
    const level=ratio>=1.2?0:ratio>=1.0?1:ratio>=0.8?2:ratio>=0.5?3:4;

            const maxV=Math.max(...trajectory.map(x=>mode==="actualise"?x.actu.res:x.prev.res),1);
            const h=Math.max(4,Math.round(Math.max(0,val)/maxV*140));
            const col=val>=objectif?"#4cc98c":val>=2000?"#4cc9a8":val>=1000?"#4c8cc9":r.hasReal&&mode==="actualise"?"#c9a84c":"#2a3a5a";
            return(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end"}}>
              <div style={{width:"100%",maxWidth:24,height:h,background:col,borderRadius:"3px 3px 0 0",transition:"height .3s"}} title={r.label+": "+Math.round(val)+"€"}/>
            </div>)})}
        </div>
        <div style={{display:"flex",gap:2,padding:"4px 4px 0"}}>
          {trajectory.map((r,i)=>i%3===0?<div key={i} style={{flex:3,fontSize:8,color:"#4a5a7a",fontFamily:"'JetBrains Mono',monospace",textAlign:"center"}}>{r.label}</div>:<div key={i} style={{flex:1}}/>)}
        </div>
      </div>
    </div>
  </div>);
};

// ─── Enchères — Bibliophile Scout v5 ───────────────────────────────
// Scan Interenchères via Edge Function Supabase → Classification JS
// Fonctionne en autonomie totale depuis le CRM local

const SCAN_FN_URL=SB_URL+"/functions/v1/bright-handler";
const MANETTE_STRONG=["manette","fort lot","caisse de livres","carton de livres","bibliothèque complète","bibliothèque d'un","important ensemble","forte réunion","fort ensemble","réunion de livres"];
const MANETTE_MEDIUM=["lot de livres","environ","en l'état","divers ouvrages","lot d'ouvrages","ensemble de livres","réunion de","brochés et reliés","lot comprenant","carton contenant","plusieurs cartons"];
const MANETTE_WEAK=["et divers","sujets divers","formats divers","plusieurs volumes","nombreux ouvrages","vieux papiers","mélanges","livres divers"];
const UNITAIRE_STRONG=["édition originale","e.o.","exemplaire numéroté","envoi autographe","ex-libris de","incunable","manuscrit enluminé","tirage de tête"];
const UNITAIRE_MEDIUM=["premier tirage","reliure signée","avec suite","grand papier","sur japon","sur chine","maroquin rouge"];
const THEME_KW={"Droit":["droit","juridique","code civil","législation","ordonnance","coutume","jurisprudence","pothier"],"Sciences":["histoire naturelle","botanique","zoologie","physique","chimie","sciences","figuier","buffon"],"Littérature":["œuvres complètes","roman","théâtre","poésie","littérature","fables","molière","voltaire","hugo","balzac"],"Histoire":["histoire","révolution","mémoires","annales","chronique"],"Voyages":["voyage","exploration","itinéraire","atlas","géographie"],"Religion":["théologie","bible","missel","liturgie","sermon","prières"],"Art":["architecture","beaux-arts","peinture","sculpture","gravures","estampes"],"Occultisme":["magie","occulte","alchimie","franc-maçon","ésotéri"]};
const PERIOD_RE=[{l:"XVIe",r:/\b15\d{2}\b|XVIe/i},{l:"XVIIe",r:/\b16\d{2}\b|XVIIe/i},{l:"XVIIIe",r:/\b17\d{2}\b|XVIIIe/i},{l:"XIXe",r:/\b18\d{2}\b|XIXe/i}];
function classifyLot(text){const t=(text||"").toLowerCase();let s=0;const re=[];MANETTE_STRONG.forEach(k=>{if(t.includes(k)){s+=3;re.push("+3 «"+k+"»")}});MANETTE_MEDIUM.forEach(k=>{if(t.includes(k)){s+=2;re.push("+2 «"+k+"»")}});MANETTE_WEAK.forEach(k=>{if(t.includes(k)){s+=1;re.push("+1 «"+k+"»")}});UNITAIRE_STRONG.forEach(k=>{if(t.includes(k)){s-=3;re.push("-3 «"+k+"»")}});UNITAIRE_MEDIUM.forEach(k=>{if(t.includes(k)){s-=2;re.push("-2 «"+k+"»")}});const vm=t.match(/(\d+)\s*(?:volumes?|vol\.?|ouvrages?|livres?|tomes?)/);const vc=vm?parseInt(vm[1]):0;if(vc>=20){s+=3;re.push("+3 "+vc+"vol")}else if(vc>=10){s+=2;re.push("+2 "+vc+"vol")}else if(vc>=5){s+=1;re.push("+1 "+vc+"vol")}const th=[];Object.entries(THEME_KW).forEach(([n,ks])=>{if(ks.some(k=>t.includes(k)))th.push(n)});const pe=[];PERIOD_RE.forEach(({l,r})=>{if(r.test(text||""))pe.push(l)});let lt="inconnu";if(s>=5)lt=t.includes("bibliothèque")?"bibliotheque":"manette";else if(s>=2)lt="manette";else if(s<=-2)lt="unitaire";let rl=40;if(lt==="manette")rl+=20;if(lt==="bibliotheque")rl+=25;if(lt==="unitaire")rl-=30;if(th.length)rl+=Math.min(th.length*5,15);if(pe.includes("XVIIIe"))rl+=10;else if(pe.includes("XVIIe"))rl+=8;else if(pe.includes("XIXe"))rl+=5;if(vc>=20)rl+=8;else if(vc>=10)rl+=5;if(["Droit","Sciences","Art"].some(x=>th.includes(x)))rl+=5;const em=(text||"").match(/(\d+)\s*[€–\-]+\s*(\d+)\s*€/);return{lotType:lt,score:s,relevance:Math.max(0,Math.min(100,rl)),reasons:re,themes:th,periods:pe,volCount:vc,estLow:em?parseInt(em[1]):0,estHigh:em?parseInt(em[2]):0}}

const DEFAULT_KW=["manette livres","carton livres anciens","lot livres reliés","bibliothèque livres anciens","fort lot ouvrages","ensemble livres reliés"];
const RelevanceBar=({score})=>{const co=score>=75?"#4caf50":score>=55?"#c9a84c":"#e6524c";return(<div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:60,height:5,background:"#0d1525",borderRadius:3,overflow:"hidden"}}><div style={{width:score+"%",height:"100%",background:co,borderRadius:3}}/></div><span style={{fontSize:11,fontWeight:700,color:co,fontFamily:"'JetBrains Mono',monospace"}}>{score}%</span></div>)};
const Bdg=({children,color="#c9a84c"})=>(<span style={{display:"inline-flex",alignItems:"center",padding:"2px 7px",borderRadius:4,fontSize:9,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",textTransform:"uppercase",background:color+"22",color,border:"1px solid "+color+"44"}}>{children}</span>);

const Encheres=()=>{
  const [results,setResults]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [scanMsg,setScanMsg]=useState("");
  const [scanErr,setScanErr]=useState("");
  const [filtre,setFiltre]=useState("tous");
  const [minScore,setMinScore]=useState(40);
  const [feedbacks,setFeedbacks]=useState({});

  }catch(e){}})()} ,[]);

  const saveData=useCallback(async(nr,nf,kws,ls)=>{

    try{const ck=await fetch(SB_URL+"/rest/v1/settings?key=eq.encheres_data&select=key",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});const ex=ck.ok?await ck.json():[];if(ex.length)await fetch(SB_URL+"/rest/v1/settings?key=eq.encheres_data",{method:"PATCH",headers:SB_H,body:JSON.stringify({value:val})});else await fetch(SB_URL+"/rest/v1/settings",{method:"POST",headers:SB_H,body:JSON.stringify({key:"encheres_data",value:val})})}catch(e){}

  const runScan=async()=>{

      if(!r.ok){setScanErr("Erreur "+r.status+": "+(await r.text()).slice(0,200));setScanning(false);return}
      const data=await r.json();
      if(data.error){setScanErr(data.error);setScanning(false);return}
      const seen=new Set(results.map(r=>r.url).filter(Boolean));const newLots=[];
      for(const item of (data.results||[])){const url=item.url||"";if(url&&seen.has(url))continue;if(url)seen.add(url);const ft=(item.title||"")+" "+(item.description||"");if(ft.length<15)continue;const cl=classifyLot(ft);newLots.push({title:item.title||"",description:item.description||"",url,house:item.house||"",date:item.date||"",estimation:item.estimation||"",keyword:item.keyword||"",fullText:ft,...cl,scannedAt:new Date().toISOString()})}
      const merged=[...newLots,...results];const ls=new Date().toISOString();
      setResults(merged);setLastScan(ls);setScanMsg("✅ "+newLots.length+" nouveaux lots ("+data.count+" bruts)");setScanning(false);saveData(merged,feedbacks,keywords,ls);
    }catch(e){setScanErr("Erreur: "+e.message);setScanning(false)}
  };

  const handleFeedback=(idx,type)=>{const nf={...feedbacks,[idx]:type};setFeedbacks(nf);saveData(results,nf)};
  const addKeyword=()=>{if(newKw.trim()&&!keywords.includes(newKw.trim())){const nk=[...keywords,newKw.trim()];setKeywords(nk);setNewKw("");saveData(null,null,nk)}};
  const removeKeyword=(kw)=>{const nk=keywords.filter(k=>k!==kw);setKeywords(nk);saveData(null,null,nk)};
  const clearResults=()=>{if(confirm("Effacer tous les résultats ?")){setResults([]);setFeedbacks({});saveData([],{},null,null)}};

  const filtered=results.filter(r=>{if(r.relevance<minScore)return false;if(filtre==="manette")return r.lotType==="manette";if(filtre==="bibliotheque")return r.lotType==="bibliotheque";if(filtre==="top")return r.relevance>=70;if(filtre==="liked")return feedbacks[results.indexOf(r)]==="like";return r.lotType!=="unitaire"}).sort((a,b)=>b.relevance-a.relevance);
  const nMan=results.filter(r=>r.lotType==="manette"||r.lotType==="bibliotheque").length;
  const nTop=results.filter(r=>r.relevance>=70).length;
  const nLk=Object.values(feedbacks).filter(f=>f==="like").length;
  const nDm=Object.values(feedbacks).filter(f=>f==="dismiss").length;
  const tco={manette:"#c9a84c",bibliotheque:"#4caf50",unitaire:"#e6524c",inconnu:"#4a5a7a"};
  const tla={manette:"Manette",bibliotheque:"Bibliothèque",unitaire:"Unitaire",inconnu:"Inconnu"};

  return(<div>
    <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:24}}>
      <Stat label="Lots détectés" value={results.length} sub={lastScan?"Scan: "+new Date(lastScan).toLocaleDateString("fr-FR"):"Aucun scan"}/>
      <Stat label="Manettes / Biblio" value={nMan} accent="#4caf50"/>
      <Stat label="Score ≥ 70" value={nTop} accent="#c9a84c"/>
      <Stat label="Feedbacks" value={nLk+nDm} sub={nLk+" 👍 · "+nDm+" ✕"} accent="#8892b0"/>
    </div>
    <div style={{...c,marginBottom:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:12}}>
        <h3 style={{margin:0,fontSize:13,textTransform:"uppercase",letterSpacing:2,color:"#6a7a9a",fontFamily:"'JetBrains Mono',monospace"}}>⚒ Bibliophile Scout</h3>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button onClick={()=>setShowKwPanel(!showKwPanel)} style={{...btnS,padding:"7px 12px",fontSize:10}}>{showKwPanel?"✕":"⚙ Mots-clés ("+keywords.length+")"}</button>
          <button onClick={()=>window.open("https://www.interencheres.com/recherche/lots?search_text=manette+livres","_blank")} style={{...btnS,padding:"7px 12px",fontSize:10}}>↗ Interenchères</button>
          {results.length>0&&<button onClick={clearResults} style={{...btnS,padding:"7px 12px",fontSize:10,color:"#e6524c",borderColor:"#e6524c44"}}>🗑</button>}
          <button onClick={runScan} disabled={scanning} style={{...btnP,padding:"9px 18px",fontSize:11,opacity:scanning?.5:1}}>{scanning?"⏳ Scan...":"🔍 Scanner Interenchères"}</button>
        </div>
      </div>
      {showKwPanel&&<div style={{background:"#0a0f1e",borderRadius:8,padding:14,marginBottom:12,border:"1px solid #1e2d4a"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:10,color:"#6a7a9a",fontFamily:"'JetBrains Mono',monospace",textTransform:"uppercase"}}>Mots-clés ({keywords.length})</span><button onClick={()=>{setKeywords(DEFAULT_KW);saveData(null,null,DEFAULT_KW)}} style={{...btnS,padding:"3px 8px",fontSize:9,color:"#e6524c",borderColor:"#e6524c44"}}>Reset</button></div>
        <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:8}}>{keywords.map(kw=>(<div key={kw} style={{display:"flex",alignItems:"center",gap:3,padding:"3px 8px",background:"#1e2d4a",borderRadius:5,fontSize:11,color:"#ccd6f6",fontFamily:"'JetBrains Mono',monospace"}}>{kw}<span onClick={()=>removeKeyword(kw)} style={{cursor:"pointer",color:"#e6524c",fontWeight:700,marginLeft:3}}>×</span></div>))}</div>
        <div style={{display:"flex",gap:6}}><input value={newKw} onChange={e=>setNewKw(e.target.value)} placeholder="Ajouter un mot-clé..." style={{...inp,flex:1,fontSize:11}} onKeyDown={e=>e.key==="Enter"&&addKeyword()}/><button onClick={addKeyword} style={{...btnP,padding:"7px 12px",fontSize:10}}>+</button></div>
      </div>}
      <div style={{display:"flex",gap:8}}><input value={customQ} onChange={e=>setCustomQ(e.target.value)} placeholder="Recherche ponctuelle (vide = mots-clés par défaut)..." style={{...inp,flex:1}} onKeyDown={e=>e.key==="Enter"&&!scanning&&runScan()}/></div>
      {scanning&&<div style={{marginTop:10,fontSize:12,color:"#c9a84c",fontFamily:"'JetBrains Mono',monospace"}}>{scanMsg}</div>}
      {!scanning&&scanMsg&&<div style={{marginTop:8,fontSize:11,color:scanMsg.startsWith("✅")?"#4caf50":"#c9a84c",fontFamily:"'JetBrains Mono',monospace"}}>{scanMsg}</div>}
      {scanErr&&<div style={{marginTop:8,fontSize:11,color:"#e6524c",fontFamily:"'JetBrains Mono',monospace"}}>{scanErr}</div>}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:14}}>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{[{k:"tous",l:"Tous"},{k:"manette",l:"Manettes"},{k:"bibliotheque",l:"Bibliothèques"},{k:"top",l:"Score ≥ 70"},{k:"liked",l:"👍 Aimés"}].map(f=>(<button key={f.k} onClick={()=>setFiltre(f.k)} style={{padding:"6px 11px",borderRadius:6,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",background:filtre===f.k?"#c9a84c18":"#0a0f1e",color:filtre===f.k?"#c9a84c":"#4a5a7a",border:"1px solid "+(filtre===f.k?"#c9a84c33":"#1a2540")}}>{f.l}</button>))}</div>

    </div>
    <div style={{fontSize:10,color:"#4a5a7a",fontFamily:"'JetBrains Mono',monospace",marginBottom:10}}>{filtered.length} lot{filtered.length>1?"s":""}{results.length>0&&" / "+results.length}</div>

    <div style={{display:"flex",flexDirection:"column",gap:8}}>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:7,flexWrap:"wrap"}}>
                <Bdg color={tc2}>{tla[lot.lotType]}</Bdg>
                {lot.periods&&lot.periods.map(p=><Bdg key={p} color="#4c8cc9">{p}</Bdg>)}
                {lot.themes&&lot.themes.slice(0,3).map(t=><Bdg key={t} color="#8892b0">{t}</Bdg>)}
                {lot.volCount>0&&<Bdg color="#6a7a9a">{lot.volCount} vol.</Bdg>}
                {lot.estLow>0&&<Bdg color="#6a7a9a">{lot.estLow}–{lot.estHigh}€</Bdg>}
                {lot.estimation&&!lot.estLow&&<Bdg color="#6a7a9a">{lot.estimation}</Bdg>}
                {fb==="like"&&<Bdg color="#4caf50">👍</Bdg>}{fb==="purchase"&&<Bdg color="#c9a84c">🛒</Bdg>}
              </div>
              <div style={{fontSize:14,fontWeight:600,color:"#e6f1ff",fontFamily:"'Playfair Display',serif",lineHeight:1.35,marginBottom:3}}>{lot.title||"Sans titre"}</div>
              <div style={{fontSize:10,color:"#4a5a7a",fontFamily:"'JetBrains Mono',monospace",lineHeight:1.5,maxHeight:isExp?"none":"2.4em",overflow:"hidden"}}>{lot.description}{lot.house&&" · 🏛 "+lot.house}{lot.date&&" · 📅 "+lot.date}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
              <RelevanceBar score={lot.relevance}/>{lot.url&&<button onClick={e=>{e.stopPropagation();window.open(lot.url,"_blank")}} style={{...btnS,padding:"4px 10px",fontSize:9}}>Voir→</button>}
            </div>
          </div>
          {isExp&&<div style={{marginTop:14,paddingTop:14,borderTop:"1px solid #1e2d4a"}}>
            <div style={{background:"#0a0f1e",borderRadius:8,padding:"10px 14px",marginBottom:12}}>
              <div style={{fontSize:10,color:"#6a7a9a",fontFamily:"'JetBrains Mono',monospace",marginBottom:4}}>CLASSIFICATION</div>
              <div style={{fontSize:11,color:"#4a5a7a",fontFamily:"'JetBrains Mono',monospace",lineHeight:1.8}}>Type: <span style={{color:tc2,fontWeight:700}}>{tla[lot.lotType]}</span> · Score: {lot.score} · Pertinence: {lot.relevance}%<br/>{lot.reasons&&lot.reasons.slice(0,6).map((r,i)=><span key={i} style={{display:"inline-block",marginRight:8,color:r.startsWith("+")?"#4caf50":"#e6524c"}}>{r}</span>)}{lot.keyword&&<><br/><span style={{color:"#4a5a7a"}}>Mot-clé: {lot.keyword}</span></>}</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[{t:"like",l:"👍 Pertinent",co:"#4caf50"},{t:"dismiss",l:"✕ Ignorer",co:"#e6524c"},{t:"purchase",l:"🛒 Acheté",co:"#c9a84c"}].map(({t,l,co})=>(<button key={t} onClick={e=>{e.stopPropagation();handleFeedback(gi,t)}} style={{padding:"5px 12px",borderRadius:6,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",background:fb===t?co+"33":"transparent",color:fb===t?co:"#6a7a9a",border:"1px solid "+(fb===t?co:"#1e2d4a")}}>{l}</button>))}
              {lot.url&&<button onClick={e=>{e.stopPropagation();window.open(lot.url,"_blank")}} style={{...btnS,padding:"5px 12px",fontSize:10,marginLeft:"auto"}}>↗ Interenchères</button>}
            </div>
          </div>}
        </div>)})}
    </div>
    {Object.keys(feedbacks).length>0&&<div style={{...c,marginTop:20,padding:12}}><span style={{fontSize:11,color:"#4a5a7a",fontFamily:"'JetBrains Mono',monospace"}}>🧠 {nLk} pertinents · {nDm} ignorés · {Object.values(feedbacks).filter(f=>f==="purchase").length} achetés</span></div>}
  </div>);
};

function LoginScreen({onLogin}) {
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");
  const [ld,setLd]=useState(false);
  // Auto-bypass if password is disabled
  useEffect(()=>{(async()=>{try{
    const r=await fetch(SB_URL+"/rest/v1/settings?key=eq.password_disabled&select=value",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});
    const d=r.ok?await r.json():[];
    if(d.length&&d[0].value==="true"){onLogin();}
  }catch(e){}})()},[]);
  const check=async()=>{
    setLd(true);setErr("");
    try{
      const r=await fetch(SB_URL+"/rest/v1/settings?key=eq.site_password&select=value",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});
      const d=r.ok?await r.json():[];
      if(d.length&&d[0].value===pw){onLogin();logActivity("login","session","","","Connexion")}
      else{setErr("Mot de passe incorrect")}
    }catch(e){setErr("Erreur de connexion")}
    setLd(false);
  };
  return(<div style={{minHeight:"100vh",background:"#080c18",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{background:"linear-gradient(135deg,#1a1a2e,#16213e)",border:"1px solid #1e2d4a",borderRadius:16,padding:40,width:"100%",maxWidth:380,textAlign:"center"}}>
      <div style={{fontSize:42,marginBottom:12}}>{"📚"}</div>
      <h1 style={{margin:"0 0 4px",fontSize:22,fontWeight:700,color:"#e6f1ff",fontFamily:"'Playfair Display',serif"}}>Livres & Reliures</h1>
      <div style={{fontSize:10,color:"#3a4a6a",fontFamily:"'JetBrains Mono',monospace",letterSpacing:2,textTransform:"uppercase",marginBottom:28}}>CRM</div>
      <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&check()} placeholder="Mot de passe" style={{width:"100%",padding:"12px 16px",background:"#0d1525",border:"1px solid #1e2d4a",borderRadius:8,color:"#e6f1ff",fontSize:14,fontFamily:"'JetBrains Mono',monospace",outline:"none",boxSizing:"border-box",textAlign:"center",marginBottom:16}}/>
      {err&&<div style={{color:"#c94c4c",fontSize:12,marginBottom:12,fontFamily:"'JetBrains Mono',monospace"}}>{err}</div>}

    </div>
  </div>);
}
