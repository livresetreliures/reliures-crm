function SettingsPanel({open,onClose}) {
  const [activeTab,setActiveTab]=useState("password");
  const [oldPw,setOldPw]=useState("");const [newPw,setNewPw]=useState("");const [confirmPw,setConfirmPw]=useState("");const [pwMsg,setPwMsg]=useState("");
  const [logs,setLogs]=useState([]);const [logsLd,setLogsLd]=useState(false);
  const [pwDisabled,setPwDisabled]=useState(false);const [pwDisabledMsg,setPwDisabledMsg]=useState("");
  // Load current password_disabled status
  useEffect(()=>{if(!open)return;(async()=>{try{
    const r=await fetch(SB_URL+"/rest/v1/settings?key=eq.password_disabled&select=value",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});
    const d=r.ok?await r.json():[];
    setPwDisabled(d.length&&d[0].value==="true");
  }catch(e){}})()},[open]);
  const togglePwDisabled=async()=>{
    const next=!pwDisabled;
    try{
      await fetch(SB_URL+"/rest/v1/settings",{method:"POST",headers:{...SB_H,"Prefer":"return=representation,resolution=merge-duplicates"},body:JSON.stringify({key:"password_disabled",value:next?"true":"false"})});
      setPwDisabled(next);
      setPwDisabledMsg(next?"⏸ Mot de passe suspendu — accès libre":"✓ Mot de passe réactivé");
      logActivity("update","settings","","Mot de passe",next?"Suspendu":"Réactivé");
      setTimeout(()=>setPwDisabledMsg(""),4000);
    }catch(e){setPwDisabledMsg("✗ Erreur")}
  };
  useEffect(()=>{if(open&&activeTab==="logs"){setLogsLd(true);fetch(SB_URL+"/rest/v1/activity_log?select=*&order=created_at.desc&limit=100",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}}).then(r=>r.json()).then(d=>{setLogs(d||[]);setLogsLd(false)}).catch(()=>setLogsLd(false))}},[open,activeTab]);
  const changePw=async()=>{setPwMsg("");if(!oldPw||!newPw){setPwMsg("Remplissez tous les champs");return}if(newPw!==confirmPw){setPwMsg("Mots de passe différents");return}if(newPw.length<4){setPwMsg("Min 4 caractères");return}try{const r=await fetch(SB_URL+"/rest/v1/settings?key=eq.site_password&select=value",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});const d=r.ok?await r.json():[];if(!d.length||d[0].value!==oldPw){setPwMsg("Ancien mot de passe incorrect");return}await fetch(SB_URL+"/rest/v1/settings?key=eq.site_password",{method:"PATCH",headers:SB_H,body:JSON.stringify({value:newPw})});logActivity("update","settings","","Mot de passe","Modifié");setPwMsg("✓ Mot de passe modifié");setOldPw("");setNewPw("");setConfirmPw("")}catch(e){setPwMsg("Erreur")}};
  const aIcons={"add":"➕","update":"✏️","delete":"🗑️","login":"🔑"};
  const eIcons={"livre":"📚","depense":"💰","settings":"⚙️","session":"🔐"};
  if(!open)return null;
  const tabBtn=(k,icon,label)=>({flex:1,padding:"9px 14px",border:"none",borderRadius:8,background:activeTab===k?"linear-gradient(135deg,#c9a84c22,#c9a84c11)":"transparent",color:activeTab===k?"#c9a84c":"#4a5a7a",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace"});
  const lbl={display:"block",fontSize:10,textTransform:"uppercase",letterSpacing:1.5,color:"#5a7a9a",marginBottom:5,fontFamily:"'JetBrains Mono',monospace"};
  const pwInp={width:"100%",padding:"9px 12px",background:"#0d1525",border:"1px solid #1e2d4a",borderRadius:8,color:"#e6f1ff",fontSize:13,fontFamily:"'JetBrains Mono',monospace",outline:"none",boxSizing:"border-box"};
  return(<Modal open={open} onClose={onClose} title="⚙️ Paramètres" wide>
    <div style={{display:"flex",gap:4,background:"#0a0f1e",borderRadius:10,padding:3,border:"1px solid #1a2540",marginBottom:20}}>
      <button onClick={()=>setActiveTab("password")} style={tabBtn("password")}>🔒 Mot de passe</button>
      <button onClick={()=>setActiveTab("logs")} style={tabBtn("logs")}>📝 Journal</button>
    </div>
    {activeTab==="password"&&<div style={{maxWidth:360,margin:"0 auto"}}>
      {/* ── Toggle suspension ── */}
      <div style={{background:pwDisabled?"rgba(201,168,76,.08)":"rgba(76,201,140,.06)",border:pwDisabled?"1px solid rgba(201,168,76,.3)":"1px solid rgba(76,201,140,.2)",borderRadius:10,padding:"16px 20px",marginBottom:24,display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
        <div>
          <div style={{fontSize:12,fontWeight:700,color:pwDisabled?"#c9a84c":"#4cc98c",fontFamily:"'JetBrains Mono',monospace",marginBottom:3}}>{pwDisabled?"⏸ Mot de passe suspendu":"🔒 Mot de passe actif"}</div>
          <div style={{fontSize:11,color:"#5a6a8a",fontFamily:"'JetBrains Mono',monospace"}}>{pwDisabled?"Accès libre sans mot de passe":"Protection activée à l'ouverture"}</div>
        </div>
        <button onClick={togglePwDisabled} style={{flexShrink:0,padding:"8px 16px",border:"none",borderRadius:8,background:pwDisabled?"linear-gradient(135deg,#4cc98c,#2a9960)":"linear-gradient(135deg,#c9a84c,#a07c30)",color:pwDisabled?"#0a0f1e":"#0a0f1e",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",whiteSpace:"nowrap"}}>{pwDisabled?"Réactiver":"Suspendre"}</button>
      </div>
      {pwDisabledMsg&&<div style={{color:pwDisabledMsg.startsWith("✗")?"#c94c4c":"#c9a84c",fontSize:11,marginBottom:14,fontFamily:"'JetBrains Mono',monospace",textAlign:"center"}}>{pwDisabledMsg}</div>}
      <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:2,color:"#3a4a6a",fontFamily:"'JetBrains Mono',monospace",marginBottom:16,borderBottom:"1px solid #1a2540",paddingBottom:8}}>Changer le mot de passe</div>
      <div style={{marginBottom:14}}><label style={lbl}>Ancien mot de passe</label><input type="password" value={oldPw} onChange={e=>setOldPw(e.target.value)} style={pwInp}/></div>
      <div style={{marginBottom:14}}><label style={lbl}>Nouveau mot de passe</label><input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} style={pwInp}/></div>
      <div style={{marginBottom:14}}><label style={lbl}>Confirmer</label><input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&changePw()} style={pwInp}/></div>
      {pwMsg&&<div style={{color:pwMsg.startsWith("✓")?"#4cc98c":"#c94c4c",fontSize:12,marginBottom:12,fontFamily:"'JetBrains Mono',monospace"}}>{pwMsg}</div>}
      <button onClick={changePw} style={{width:"100%",padding:"10px",background:"linear-gradient(135deg,#c9a84c,#a07c30)",border:"none",borderRadius:8,color:"#0a0f1e",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace"}}>Modifier</button>
    </div>}
    {activeTab==="logs"&&<div>
      {logsLd?<div style={{textAlign:"center",color:"#8892b0",padding:20}}>Chargement...</div>:
      logs.length===0?<div style={{textAlign:"center",color:"#3a4a6a",padding:20,fontSize:13}}>Aucune activit\u00e9</div>:
      <div style={{maxHeight:400,overflowY:"auto"}}>{logs.map((l,i)=>(<div key={i} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"10px 0",borderBottom:"1px solid #111827"}}>
        <div style={{fontSize:16,minWidth:24,textAlign:"center"}}>{aIcons[l.action]||"•"}</div>
        <div style={{flex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:12,color:"#e6f1ff",fontWeight:600}}>{eIcons[l.entity_type]||""} {l.entity_label||l.entity_type}</div>
            <div style={{fontSize:10,color:"#3a4a6a",fontFamily:"'JetBrains Mono',monospace"}}>{l.created_at?new Date(l.created_at).toLocaleString("fr-FR"):""}</div>
          </div>
          {l.details&&<div style={{fontSize:11,color:"#6a7a9a",marginTop:3}}>{l.details}</div>}
        </div>
      </div>))}</div>}
    </div>}
  </Modal>);
}


function App(){
  const [authed,setAuthed]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [books,setBooks]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const urlParams=new URLSearchParams(window.location.search);
  const [tab,setTab]=useState(urlParams.get("camera")==="1"?"inventaire":"dashboard");
  const [selectedBookFromDashboard,setSelectedBookFromDashboard]=useState(null);
  const [autoOpenAdd,setAutoOpenAdd]=useState(urlParams.get("camera")==="1");
  const [loading,setLoading]=useState(true);
  const [syncMsg,setSyncMsg]=useState("");
  const [newBookAlert,setNewBookAlert]=useState(null);

  const [recalcTrigger,setRecalcTrigger]=useState(0);

  // Supabase Realtime listener pour les nouveaux livres
  useEffect(()=>{
    const supabase=window.supabase.createClient(SB_URL,SB_KEY);
    const channel=supabase.channel('livres-changes')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'livres'},async(payload)=>{
        console.log('Nouveau livre reçu:',payload);
        const newBook=dbToBook(payload.new);
        setBooks(prev=>{
          if(prev.some(b=>b.id===newBook.id))return prev;
          return[...prev,newBook];
        });
        setNewBookAlert(newBook);
        setTab("inventaire");
        setSelectedBookFromDashboard(newBook);
        // Son de notification - avec resume() pour débloquer l'AudioContext
        try{
          const AudioContext=window.AudioContext||window.webkitAudioContext;
          if(AudioContext){
            const ctx=new AudioContext();
            // Débloquer l'AudioContext si suspendu
            if(ctx.state==='suspended'){await ctx.resume();}
            const playNote=(freq,startTime,duration)=>{
              const osc=ctx.createOscillator();
              const gain=ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.type='sine';
              osc.frequency.setValueAtTime(freq,ctx.currentTime+startTime);
              gain.gain.setValueAtTime(0.4,ctx.currentTime+startTime);
              gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+startTime+duration);
              osc.start(ctx.currentTime+startTime);
              osc.stop(ctx.currentTime+startTime+duration);
            };
            // Notes: La5 (880Hz), Do#6 (1108Hz), Mi6 (1318Hz) - carillon ascendant
            playNote(880,0,0.4);
            playNote(1108,0.15,0.4);
            playNote(1318,0.3,0.5);
          }
        }catch(ex){console.log('Audio error:',ex);}
        setSyncMsg("🔔 Nouveau livre ajouté !");
        setTimeout(()=>setSyncMsg(""),5000);
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'livres'},(payload)=>{
        const updatedBook=dbToBook(payload.new);
        setBooks(prev=>prev.map(b=>b.id===updatedBook.id?updatedBook:b));
      })
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'livres'},(payload)=>{
        setBooks(prev=>prev.filter(b=>b.id!==payload.old.id));
      })
      .subscribe((status)=>{
        console.log('Realtime status:',status);
        if(status==='SUBSCRIBED')console.log('✓ Realtime connecté');
      });
    return()=>{supabase.removeChannel(channel)};
  },[]);

  // Auto-recompute pxAchat whenever expenses change or recalc is triggered
  useEffect(()=>{
    if(!books.length)return;
    const pxMap=computePxAchat(books,expenses);
    let changed=false;
    const updated=books.map(b=>{
      const computed=pxMap[b.id]||0;
      if(Math.abs(computed-(b.pxAchat||0))>0.005){changed=true;return{...b,pxAchat:computed}}
      return b;
    });
    if(changed){setBooks(updated);updated.forEach(b=>{const orig=books.find(o=>o.id===b.id);if(orig&&Math.abs((b.pxAchat||0)-(orig.pxAchat||0))>0.005){fetch(SB_URL+"/rest/v1/livres?id=eq."+encodeURIComponent(b.id),{method:"PATCH",headers:SB_H,body:JSON.stringify({px_achat:b.pxAchat})}).catch(()=>{})}})}
  },[books,expenses,recalcTrigger]);

  useEffect(()=>{(async()=>{try{
    const bRes=await fetch(SB_URL+"/rest/v1/livres?select=*&order=id.asc",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});
    const bData=bRes.ok?await bRes.json():[];
    const eRes=await fetch(SB_URL+"/rest/v1/depenses?select=*&order=id.asc",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});
    const eData=eRes.ok?await eRes.json():[];
    if(bData.length===0){
      setSyncMsg("Initialisation...");
      for(let i=0;i<IMPORTED_BOOKS.length;i+=10){await fetch(SB_URL+"/rest/v1/livres",{method:"POST",headers:SB_H,body:JSON.stringify(IMPORTED_BOOKS.slice(i,i+10).map(bookToDb))})}
      for(let i=0;i<IMPORTED_EXPENSES.length;i+=10){await fetch(SB_URL+"/rest/v1/depenses",{method:"POST",headers:SB_H,body:JSON.stringify(IMPORTED_EXPENSES.slice(i,i+10).map(expToDb))})}
      setBooks(IMPORTED_BOOKS);setExpenses(IMPORTED_EXPENSES);setSyncMsg("✓ Base initialisée");
    }else{setBooks(bData.map(dbToBook));
      const exps=eData.map(dbToExp);
      // Migrate G -> TOUTES
      exps.forEach(e=>{if(e.venteNum==="G"){e.venteNum="TOUTES";if(e.id){try{fetch(SB_URL+"/rest/v1/depenses?id=eq."+e.id,{method:"PATCH",headers:SB_H,body:JSON.stringify({vente_num:"TOUTES"})})}catch(ex){}}}});
      // Migrate Achat 0 if still old format
      const a0=exps.find(e=>e.venteNum==="0"&&(e.categorie==="Divers"||e.vendeur==="-"));
      if(a0){a0.categorie="Achat de livres";a0.vendeur="Gratuit";a0.date="2025-01-01";a0.description="Livres obtenus gratuitement";a0.montant=0;
        if(a0.id){try{fetch(SB_URL+"/rest/v1/depenses?id=eq."+a0.id,{method:"PATCH",headers:SB_H,body:JSON.stringify({categorie:"Achat de livres",vendeur:"Gratuit",date:"2025-01-01",description:"Livres obtenus gratuitement",montant:0})})}catch(e){}}
      }
      // Ensure Achat 0 exists — if no entry with venteNum "0" and categorie "Achat de livres", inject one
      if(!exps.some(e=>e.venteNum==="0"&&e.categorie==="Achat de livres")){
        const newA0={venteNum:"0",date:"2025-01-01",categorie:"Achat de livres",vendeur:"Gratuit",montant:0,description:"Livres obtenus gratuitement"};
        exps.unshift(newA0);
        try{fetch(SB_URL+"/rest/v1/depenses",{method:"POST",headers:SB_H,body:JSON.stringify(expToDb(newA0))})}catch(ex){}
      }
      // Purge Commission eBay entries (no longer tracked as expenses)
      const commIds=exps.filter(e=>e.categorie==="Commission eBay").map(e=>e.id).filter(Boolean);
      commIds.forEach(id=>{try{fetch(SB_URL+"/rest/v1/depenses?id=eq."+id,{method:"DELETE",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}})}catch(e){}});
      const cleaned=exps.filter(e=>e.categorie!=="Commission eBay");
      // Rename Frais d'envoi (Colissimo) -> Frais d'envoi
      cleaned.forEach(e=>{if(e.categorie==="Frais d'envoi (Colissimo)"){e.categorie="Frais d'envoi";if(e.id){try{fetch(SB_URL+"/rest/v1/depenses?id=eq."+e.id,{method:"PATCH",headers:SB_H,body:JSON.stringify({categorie:"Frais d'envoi"})})}catch(ex){}}}});
      setExpenses(cleaned);setSyncMsg("✓ "+bData.length+" livres")}
  }catch(err){setBooks(IMPORTED_BOOKS);setExpenses(IMPORTED_EXPENSES);setSyncMsg("✗ Mode hors-ligne")}
  setLoading(false);setRecalcTrigger(t=>t+1);setTimeout(()=>setSyncMsg(""),4000)})()},[]);

  const refreshData=async()=>{
    setSyncMsg("↻ Actualisation...");
    try{
      const bRes=await fetch(SB_URL+"/rest/v1/livres?select=*&order=id.asc",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});
      const bData=bRes.ok?await bRes.json():null;
      if(bData)setBooks(bData.map(dbToBook));
      const eRes=await fetch(SB_URL+"/rest/v1/depenses?select=*&order=id.asc",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});
      const eData=eRes.ok?await eRes.json():null;
      if(eData)setExpenses(eData.map(dbToExp));
      setSyncMsg("✓ Actualisé");setRecalcTrigger(t=>t+1);
    }catch(e){setSyncMsg("✗ Erreur actualisation")}
    setTimeout(()=>setSyncMsg(""),3000);
  };
  const addBook=async(b)=>{
    setBooks(p=>[...p,b]);
    setRecalcTrigger(t=>t+1);
    logActivity("add","livre",b.id,b.titre,"Ajout #"+b.id);
    try{
      const res=await fetch(SB_URL+"/rest/v1/livres",{method:"POST",headers:SB_H,body:JSON.stringify(bookToDb(b))});
      if(!res.ok){
        const errText=await res.text();
        console.error("Erreur Supabase addBook:",res.status,errText);
        setSyncMsg("✗ Erreur sync: "+res.status);
        setTimeout(()=>setSyncMsg(""),5000);
      }else{
        console.log("✓ Livre envoyé à Supabase:",b.id);
      }
    }catch(e){
      console.error("Erreur réseau addBook:",e);
      setSyncMsg("✗ Erreur réseau");
      setTimeout(()=>setSyncMsg(""),5000);
    }
  };
  const editBook=async(b)=>{
    setBooks(p=>p.map(x=>x.id===b.id?b:x));
    setRecalcTrigger(t=>t+1);
    logActivity("update","livre",b.id,b.titre,"Modif #"+b.id);
    try{
      const res=await fetch(SB_URL+"/rest/v1/livres?id=eq."+encodeURIComponent(b.id),{method:"PATCH",headers:SB_H,body:JSON.stringify(bookToDb(b))});
      if(!res.ok){
        const errText=await res.text();
        console.error("Erreur Supabase editBook:",res.status,errText);
        setSyncMsg("✗ Erreur sync: "+res.status);
        setTimeout(()=>setSyncMsg(""),5000);
      }
    }catch(e){
      console.error("Erreur réseau editBook:",e);
      setSyncMsg("✗ Erreur réseau");
      setTimeout(()=>setSyncMsg(""),5000);
    }
  };
  const deleteBook=async(id)=>{const bk=books.find(x=>x.id===id);logActivity("delete","livre",id,bk?bk.titre:"","Suppr #"+id);setBooks(p=>p.filter(x=>x.id!==id));try{await fetch(SB_URL+"/rest/v1/livres?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}})}catch(e){}};
  const addExpense=async(e)=>{setExpenses(p=>[...p,e]);logActivity("add","depense","",e.description||e.categorie,""+e.montant+"€");try{await fetch(SB_URL+"/rest/v1/depenses",{method:"POST",headers:SB_H,body:JSON.stringify(expToDb(e))})}catch(e2){}};
  const deleteExpense=async(idx)=>{const exp=expenses[idx];setExpenses(p=>p.filter((_,i)=>i!==idx));if(exp&&exp.id){try{await fetch(SB_URL+"/rest/v1/depenses?id=eq."+exp.id,{method:"DELETE",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}})}catch(e){}}};
  const syncBookExpense=(bookId,categorie,data)=>{
    // data={venteNum,date,vendeur,montant,description} or null to delete
    const tag="livre #"+bookId;
    setExpenses(prev=>{
      const idx=prev.findIndex(e=>(e.categorie===categorie||e.categorie==="Frais d'envoi (Colissimo)"&&categorie==="Frais d'envoi")&&e.description&&e.description.toLowerCase().includes(tag.toLowerCase()));
      if(!data||!data.montant||data.montant<=0){
        // Delete if exists
        if(idx>=0){const exp=prev[idx];if(exp.id){try{fetch(SB_URL+"/rest/v1/depenses?id=eq."+exp.id,{method:"DELETE",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}})}catch(e){}}return prev.filter((_,i)=>i!==idx)}
        return prev;
      }
      if(idx>=0){
        // Update existing
        const updated=[...prev];const old=updated[idx];updated[idx]={...old,...data,categorie};
        if(old.id){try{fetch(SB_URL+"/rest/v1/depenses?id=eq."+old.id,{method:"PATCH",headers:SB_H,body:JSON.stringify(expToDb({...data,categorie}))})}catch(e){}}
        return updated;
      } else {
        // Create new
        const newExp={...data,categorie};
        try{fetch(SB_URL+"/rest/v1/depenses",{method:"POST",headers:SB_H,body:JSON.stringify(expToDb(newExp))})}catch(e){}
        return [...prev,newExp];
      }
    });
  };
  if(!authed)return(<LoginScreen onLogin={()=>setAuthed(true)}/>);
  if(loading)return(<div style={{minHeight:"100vh",background:"#080c18",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
    <div style={{fontSize:28,color:"#c9a84c"}}>📚</div>
    <div style={{color:"#8892b0",fontFamily:"'JetBrains Mono',monospace",fontSize:13}}>Chargement...</div>
  </div>);

  return(<div style={{minHeight:"100vh",background:"#080c18",color:"#ccd6f6",fontFamily:"'Georgia','Times New Roman',serif"}}>
    <header style={{background:"linear-gradient(135deg,#0d1525,#111827,#0d1525)",borderBottom:"1px solid #1a2540",padding:"16px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{fontSize:28,fontFamily:"'Playfair Display',serif",color:"#c9a84c"}}>📚</div>
        <div><h1 style={{margin:0,fontSize:20,fontWeight:700,color:"#e6f1ff",fontFamily:"'Playfair Display',serif",letterSpacing:1}}>Livres & Reliures</h1>
        <div style={{fontSize:10,color:"#3a4a6a",fontFamily:"'JetBrains Mono',monospace",letterSpacing:2,textTransform:"uppercase"}}>CRM · {books.length} ouvrages</div></div>
      </div>
      <div style={{display:"flex",gap:3,background:"#0a0f1e",borderRadius:10,padding:3,border:"1px solid #1a2540",flexWrap:"wrap"}}>
        {TABS.map(t=>(<button key={t.key} onClick={()=>setTab(t.key)} style={{padding:"9px 14px",border:t.highlight?"1px solid #c94c4c":"none",borderRadius:8,background:tab===t.key?(t.highlight?"linear-gradient(135deg,#c94c4c33,#c94c4c22)":"linear-gradient(135deg,#c9a84c22,#c9a84c11)"):(t.highlight?"linear-gradient(135deg,#c94c4c11,#c94c4c08)":"transparent"),color:tab===t.key?(t.highlight?"#ff6b6b":"#c9a84c"):(t.highlight?"#c94c4c":"#4a5a7a"),fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",transition:"all .2s"}}><span style={{marginRight:5}}>{t.icon}</span>{t.label}</button>))}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        {syncMsg&&<div style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:syncMsg.startsWith("✓")?"#4cc98c":syncMsg.startsWith("✗")?"#c94c4c":"#8ab4f8"}}>{syncMsg}</div>}
        <button onClick={()=>setShowSettings(true)} style={{...btnS,padding:"9px 12px",fontSize:14,borderRadius:"50%",width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center"}} title="Paramètres">⚙</button>
        <button onClick={()=>exportCSV(books)} style={{...btnS,padding:"9px 16px",fontSize:11}}>⬇ Export CSV</button>
      </div>
    </header>
    <main style={{padding:"24px 28px",maxWidth:1440,margin:"0 auto"}}>
      {tab==="dashboard"&&<Dashboard books={books} expenses={expenses} onSelectBook={setSelectedBookFromDashboard} setTab={setTab}/>}
      {tab==="inventaire"&&<Inventaire books={books} expenses={expenses} onAdd={addBook} onEdit={editBook} onDelete={deleteBook} onSyncExpense={syncBookExpense} autoOpenAdd={autoOpenAdd} setAutoOpenAdd={setAutoOpenAdd} onRefresh={refreshData} selectedBookFromDashboard={selectedBookFromDashboard} clearSelectedBook={()=>setSelectedBookFromDashboard(null)}/>}
      {tab==="ventes"&&<Ventes books={books} expenses={expenses}/>}
      {tab==="sourcing"&&<Sourcing books={books} expenses={expenses}/>}
      {tab==="depenses"&&<Depenses expenses={expenses} onAdd={addExpense} onDelete={deleteExpense} books={books}/>}
      {tab==="encheres"&&<Encheres/>}
      {tab==="businessplan"&&<BusinessPlan books={books} expenses={expenses}/>}
    </main>
    <SettingsPanel open={showSettings} onClose={()=>setShowSettings(false)}/>
  </div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
